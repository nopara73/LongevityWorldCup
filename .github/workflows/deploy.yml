name: Auto Deploy on Master

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - production-deploy
  workflow_run:
    workflows: [".NET", "CodeQL", "Image delivery", "Reddit app"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require full CI for this commit
        id: ci
        uses: actions/github-script@v9
        with:
          script: |
            const { gate } = require('./.github/scripts/deployment-gate.cjs');
            await gate({ github, context, core });

      - name: Setup Node.js
        if: steps.ci.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: LongevityWorldCup.Website/package-lock.json

      - name: Build frontend artifact
        if: steps.ci.outputs.deploy == 'true'
        working-directory: LongevityWorldCup.Website
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          tracked="$(git -C "$GITHUB_WORKSPACE" ls-files -- 'LongevityWorldCup.Website/wwwroot/js')"
          if [[ -n "$tracked" ]]; then
            echo "$tracked"
            exit 1
          fi

      - name: Package frontend artifact
        if: steps.ci.outputs.deploy == 'true'
        run: |
          tar -czf frontend-assets.tar.gz -C LongevityWorldCup.Website/wwwroot js
          sha256sum frontend-assets.tar.gz > frontend-assets.tar.gz.sha256

      - name: Recheck master before staging production files
        if: steps.ci.outputs.deploy == 'true'
        id: freshness
        env:
          VERIFIED_SHA: ${{ steps.ci.outputs.sha }}
        run: |
          set -eu
          latest_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$latest_sha"
          if [ "$latest_sha" = "$VERIFIED_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit $VERIFIED_SHA; master is $latest_sha."
          fi

      - name: Stage frontend artifact
        if: steps.freshness.outputs.deploy == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          source: "frontend-assets.tar.gz,frontend-assets.tar.gz.sha256"
          target: "/tmp/longevityworldcup-frontend"
          rm: true
          command_timeout: 2m

      - name: Deploy via SSH
        if: steps.freshness.outputs.deploy == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VERIFIED_SHA: ${{ steps.ci.outputs.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          envs: VERIFIED_SHA
          script_path: .github/scripts/deploy-production.sh
