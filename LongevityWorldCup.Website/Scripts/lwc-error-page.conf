proxy_intercept_errors on;
# A missing fallback file must still reach the branded 502 page.
recursive_error_pages on;
error_page 502 = @lwc_bad_gateway;
error_page 503 /503.html;
error_page 504 /504.html;

# The gallery falls back to the original when a preview fails. Published
# proofs are still on disk while Kestrel restarts during a deployment.
location @lwc_bad_gateway {
    error_page 502 /502.html;
    if ($request_method !~ ^(GET|HEAD)$) { return 502; }
    if ($uri !~* "^/athletes/[a-z0-9_-]+/proof_[a-z0-9_.-]*\.(webp|png|jpe?g|bmp|gif)$") { return 502; }
    root /var/www/LongevityWorldCup/publish/wwwroot;
    try_files $uri =502;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /502.html {
    internal;
    alias /var/www/longevityworldcup-errors/502.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
location = /503.html {
    internal;
    alias /var/www/longevityworldcup-errors/503.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
location = /504.html {
    internal;
    alias /var/www/longevityworldcup-errors/504.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
location = /error/herold.png {
    alias /var/www/longevityworldcup-errors/herold.png;
    add_header Cache-Control "public, max-age=300" always;
}
location = /assets/favicon-128x128.png {
    alias /var/www/longevityworldcup-errors/favicon-128x128.png;
    add_header Cache-Control "public, max-age=300" always;
}
location = /css/error-system.css {
    alias /var/www/longevityworldcup-errors/error-system.css;
    add_header Cache-Control "public, max-age=300" always;
}
location = /assets/fonts/Roboto-Regular.woff2 {
    alias /var/www/longevityworldcup-errors/Roboto-Regular.woff2;
    add_header Cache-Control "public, max-age=300" always;
}
location = /assets/fonts/Roboto-Bold.woff2 {
    alias /var/www/longevityworldcup-errors/Roboto-Bold.woff2;
    add_header Cache-Control "public, max-age=300" always;
}
