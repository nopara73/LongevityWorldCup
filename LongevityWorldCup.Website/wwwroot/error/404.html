<!DOCTYPE html>
<html lang="en">
<head>
    <title>404 Not Found - Longevity World Cup</title>
    <script id="pageAnalyticsPrivacy">window.LwcDisableGoogleAnalytics = true;</script>
    <!--HEAD-->
    <link rel="stylesheet" href="{{ASSET_LANDING_PAGE_CSS}}">
    <style>
        /* Hide the join-game button in the header */
        .join-game {
            display: none !important;
        }

        .not-found-main [data-aos]:not(.aos-animate) {
            opacity: 1;
            transform: none;
        }
    </style>
</head>
<body class="status-page">
    <!--HEADER-->
    <main class="status-main not-found-main">
        <section class="landing-sheet status-sheet not-found-card" aria-labelledby="appReviewTitle">
            <div class="landing-cover">
                <figure class="status-seal not-found-visual" data-aos="fade" data-aos-duration="700" data-aos-delay="200">
                    <img src="/error/herold.png" alt="Illustration for page not found" width="1024" height="1536" decoding="async">
                </figure>
                <h1 id="appReviewTitle" class="landing-title not-found-title" data-aos="fade" data-aos-duration="700" data-aos-delay="200"><span class="status-code">404</span> not found</h1>
                <p class="landing-lead not-found-copy" data-aos="fade" data-aos-duration="700" data-aos-delay="300">
                    This page didn’t qualify for the Longevity World Cup
                </p>
            </div>
            <div class="landing-close not-found-actions" data-aos="fade" data-aos-duration="700" data-aos-delay="400">
                <button class="option-button" onclick="window.location.href = '/'">
                    <i class="fas fa-home" aria-hidden="true"></i>Home
                </button>
            </div>
        </section>
    </main>
    <!--FOOTER-->
</body>
</html>
