<!DOCTYPE html>
<html lang="en">
<head>
    <title>404 Not Found - Longevity World Cup</title>
    <script id="pageAnalyticsPrivacy">window.LwcDisableGoogleAnalytics = true;</script>
    <!--HEAD-->
    <link rel="stylesheet" href="{{ASSET_STANDALONE_FEEL_CSS}}">
    <style>
        /* Hide the join-game button in the header */
        .join-game {
            display: none !important;
        }

        /* Fan-cam stage, shared with the outage pages: Herold sits in a round
           portrait astride the card's top edge, and the scoreboard, the line
           and Home stand centred beneath him. */
        .not-found-main {
            --fan-cam: clamp(132px, 22vw, 184px);
            box-sizing: border-box;
            width: 100%;
            max-width: 640px;
            min-height: min(calc(100svh - 4.5rem), 52rem);
            margin: 0 auto;
            padding: calc(var(--fan-cam) / 2 + clamp(1.25rem, 4vh, 2.5rem)) 1rem clamp(1.5rem, 5vh, 3rem);
            display: grid;
            align-content: center;
        }

        .not-found-main [data-aos]:not(.aos-animate) {
            opacity: 1;
            transform: none;
        }

        .not-found-card {
            display: grid;
            justify-items: center;
            padding: 0 clamp(1.25rem, 5vw, 2.75rem) clamp(1.5rem, 5vw, 2.5rem);
            text-align: center;
            background: var(--lwc-surface);
            border: 1px solid var(--lwc-border);
            border-radius: var(--lwc-radius-lg);
            box-shadow: var(--lwc-shadow-sm), 0 24px 48px -32px rgba(15, 23, 42, 0.4);
        }

        .not-found-visual {
            position: relative;
            width: var(--fan-cam);
            height: var(--fan-cam);
            margin: calc(var(--fan-cam) / -2) 0 1.25rem;
            border-radius: 50%;
            cursor: pointer;
            perspective: 600px;
        }

        /* A quiet accent ring around the seat, like the outage retry ring at rest. */
        .not-found-visual::before {
            content: "";
            position: absolute;
            inset: -11px;
            border-radius: 50%;
            border: 3px solid var(--lwc-border);
            border-top-color: var(--lwc-accent);
            border-right-color: var(--lwc-accent);
            rotate: -45deg;
        }

        .not-found-visual picture {
            display: block;
            width: 100%;
            height: 100%;
        }

        .not-found-visual .illustration {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            margin: 0;
            border: 0;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 16%;
            background: var(--lwc-surface-muted);
            box-shadow: 0 0 0 5px var(--lwc-surface), 0 14px 30px -16px rgba(15, 23, 42, 0.6);
        }

        .not-found-body {
            display: grid;
            justify-items: center;
            gap: 0.9rem;
            min-width: 0;
        }

        .not-found-title {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.25em 0.4em;
            margin: 0;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.05;
            text-align: center;
        }

        .not-found-copy {
            max-width: 28ch;
            margin: 0;
            color: var(--lwc-muted);
            font-size: clamp(1.1rem, 1.6vw, 1.25rem);
            line-height: 1.45;
            text-align: center;
            text-wrap: balance;
        }

        .not-found-body .not-found-actions {
            width: min(100%, 15rem);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 0.5rem 0 0;
        }

        .not-found-actions .option-button {
            width: 100%;
            min-width: 0;
            max-width: none;
            margin: 0;
            padding-inline: 1.75rem;
            box-sizing: border-box;
        }

        .not-found-actions .back-button {
            margin-left: 0;
        }

        @media (prefers-color-scheme: dark) {
            .not-found-visual .illustration {
                box-shadow: 0 0 0 5px var(--lwc-surface), 0 14px 30px -16px rgba(0, 0, 0, 0.85);
            }
        }

        @media (prefers-reduced-motion: no-preference) {
            /* The ring draws in around the seat as the camera cuts to Herold. */
            .not-found-visual::before {
                animation: nf-ring-in 700ms 200ms cubic-bezier(0.2, 0, 0, 1) backwards;
            }
        }

        @keyframes nf-ring-in {
            from { opacity: 0; rotate: -225deg; scale: 0.92; }
        }

        @media (max-width: 719px) {
            .not-found-main {
                min-height: 0;
                padding: calc(var(--fan-cam) / 2 + 1.5rem) 0.75rem 2rem;
                align-content: start;
            }

            .not-found-body .not-found-actions {
                width: 100%;
            }
        }

        /* Short landscape phones: a smaller seat keeps Home on screen. */
        @media (min-width: 560px) and (max-height: 480px) {
            .not-found-main {
                --fan-cam: 96px;
                min-height: 0;
                padding-block: calc(var(--fan-cam) / 2 + 0.75rem) 0.75rem;
            }

            .not-found-visual {
                margin-bottom: 0.5rem;
            }

            .not-found-body {
                gap: 0.5rem;
            }

            .not-found-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!--HEADER-->
    <main class="not-found-main">
        <section class="not-found-card">
        <div class="not-found-visual" data-aos="fade" data-aos-duration="700" data-aos-delay="200">
            <picture>
                <img src="/error/herold.png" alt="Illustration for page not found" class="illustration" width="1024" height="1536" decoding="async">
            </picture>
        </div>
        <div class="not-found-body">
        <h1 id="appReviewTitle" class="not-found-title" aria-label="404 not found" data-aos="fade" data-aos-duration="700" data-aos-delay="200"><span class="nf-score" aria-hidden="true"><span class="nf-digit"><span class="nf-reel" data-reel="7&#10;1&#10;9&#10;2">4</span></span><span class="nf-digit"><span class="nf-reel" data-reel="8&#10;3&#10;6&#10;5&#10;9">0</span></span><span class="nf-digit"><span class="nf-reel" data-reel="2&#10;8&#10;1&#10;6&#10;3&#10;7">4</span></span></span> <span class="nf-rest">not found</span></h1>
        <p class="not-found-copy" data-aos="fade" data-aos-duration="700" data-aos-delay="300">
            This page didn’t qualify for the Longevity World Cup
        </p>
        <div class="options-container not-found-actions" data-aos="fade" data-aos-duration="700" data-aos-delay="400">
            <button class="option-button back-button" onclick="window.location.href = '/'">
                <i class="fas fa-home"></i>&nbsp;Home
            </button>
        </div>
        </div>
        </section>
    </main>
    <!--FOOTER-->
    <script>
        // Herold leans toward the pointer and shakes his head when tapped.
        (function () {
            const card = document.querySelector(".not-found-card");
            const visual = document.querySelector(".not-found-visual");
            if (!card || !visual || !window.matchMedia("(prefers-reduced-motion: no-preference)").matches) return;
            if (window.matchMedia("(hover: hover)").matches) {
                card.addEventListener("pointermove", event => {
                    const box = visual.getBoundingClientRect();
                    const x = Math.max(-1, Math.min(1, (event.clientX - box.left) / box.width * 2 - 1));
                    const y = Math.max(-1, Math.min(1, (event.clientY - box.top) / box.height * 2 - 1));
                    visual.style.setProperty("--nf-tilt-x", x.toFixed(3));
                    visual.style.setProperty("--nf-tilt-y", y.toFixed(3));
                });
                card.addEventListener("pointerleave", () => {
                    visual.style.removeProperty("--nf-tilt-x");
                    visual.style.removeProperty("--nf-tilt-y");
                });
            }
            visual.addEventListener("click", () => {
                visual.removeAttribute("data-nope");
                void visual.offsetWidth;
                visual.setAttribute("data-nope", "");
            });
            visual.addEventListener("animationend", event => {
                if (event.animationName === "nf-nope") visual.removeAttribute("data-nope");
            });
        })();
    </script>
</body>
</html>
