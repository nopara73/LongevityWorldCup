<!DOCTYPE html>
<html lang="en">
<head>
    <title>Longevity World Cup - Event board</title>
    <!--HEAD-->
    <style>
        .join-game {
            display: none !important;
        }

        /* The Highlights page is one card: the title band and the feed share
           a column, an edge and the board's pale head strip, and the feed below
           reads as a timeline whose events are grouped by day. */
        main.event-board-page {
            --feed-width: min(100% - 2rem, 860px);
            --feed-radius: var(--lwc-radius-lg, 12px);
            --feed-pad-x: var(--lwc-space-5, 24px);
            --feed-clearance: var(--lwc-space-5, 24px);
        }

        .event-board-heading,
        .event-board-page .events-board {
            box-sizing: border-box;
        }

        .event-board-heading {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--lwc-space-3, 12px) var(--lwc-space-4, 16px);
            margin: 0 auto;
            /* The page scrolls this heading to the sticky header; the clear
               strip above the band keeps the title off it. */
            padding: calc(var(--feed-clearance) + var(--lwc-space-4, 16px)) var(--feed-pad-x) var(--lwc-space-4, 16px);
        }

        .event-board-heading::before {
            content: "";
            position: absolute;
            inset: var(--feed-clearance) 0 0;
            z-index: -1;
            border: 1px solid var(--events-border);
            border-bottom: 0;
            border-radius: var(--feed-radius) var(--feed-radius) 0 0;
            background: var(--events-header-bg);
        }

        .event-board-heading h1 {
            flex: 1 1 max-content;
            min-width: 0;
            margin: 0;
            color: var(--events-header-ink);
            font-size: clamp(1.6rem, 3.2vw, 2.15rem);
            line-height: 1.1;
            text-align: left;
        }

        .event-board-actions {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            max-width: 100%;
            gap: var(--lwc-space-2, 8px);
            margin-left: auto;
        }

        .event-feed-link,
        .event-push-toggle {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            gap: var(--lwc-space-2, 8px);
            min-width: 44px;
            min-height: 44px;
            box-sizing: border-box;
            border: 1px solid var(--lwc-border, #b7c7cd);
            border-radius: var(--lwc-radius-md, 8px);
            background: var(--lwc-surface, #fff);
            color: var(--secondary-color, #087685);
            font: inherit;
            font-size: var(--lwc-type-sm, .875rem);
            font-weight: 700;
            text-decoration: none;
            transition: background-color var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), border-color var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
        }

        .event-feed-link { padding: 0 var(--lwc-space-4, 16px); }
        .event-push-toggle { width: 44px; height: 44px; padding: 0; cursor: pointer; }
        .event-push-toggle[hidden] { display: none; }
        .event-feed-link:hover,
        .event-push-toggle:hover { border-color: var(--secondary-color, #087685); background: var(--lwc-surface-muted, #eef2f5); }
        .event-push-toggle[aria-pressed="true"] { background: var(--secondary-color, #087685); color: var(--lwc-on-accent, #fff); border-color: var(--secondary-color, #087685); }
        .event-feed-link:focus-visible,
        .event-push-toggle:focus-visible { outline: 2px solid var(--secondary-color, #087685); outline-offset: 2px; }
        .event-push-toggle:disabled { opacity: .55; cursor: default; }

        /* Notification feedback is part of the band, under its title. */
        .event-push-status {
            flex: 1 0 100%;
            margin: 0;
            color: var(--events-header-ink);
            font-size: var(--lwc-type-sm, .875rem);
            text-align: left;
        }
        .event-push-status:empty { display: none; }

        .event-board-heading,
        .event-board-page .events-board {
            width: var(--feed-width);
        }

        .event-board-page .events-board {
            --event-date-column: 4.5rem;
            /* Month headings stop under the site's sticky bar. */
            --event-month-top: 3.25rem;
            --event-avatar-target: 44px;
            --event-avatar-inset: 0px;
            --event-avatar-gap: var(--lwc-space-3, 12px);
            --event-avatar-size: 32px;
            --event-message-start: calc(var(--event-date-column) + var(--event-avatar-column));
            /* The timeline passes through the centre of every portrait. */
            --event-rail-x: calc(var(--event-date-column) + var(--event-avatar-inset) + var(--event-avatar-target) / 2 - 1px);
            --event-rail: linear-gradient(var(--events-border), var(--events-border));
            flex-grow: 0;
            margin: 0 auto;
            /* Clipped, not hidden, so month headings can stick to the viewport. */
            overflow: clip;
            border: 1px solid var(--events-border);
            border-radius: 0 0 var(--feed-radius) var(--feed-radius);
            box-shadow: var(--lwc-shadow-sm, 0 1px 2px rgba(15,23,42,.08));
        }

        .event-board-page .events-board thead,
        .event-board-page .events-board colgroup {
            display: none;
        }

        .event-board-page .events-board table,
        .event-board-page .events-board tbody {
            display: block;
            width: 100%;
            padding: 0;
        }

        .event-board-page .events-board tbody {
            padding-block: 0 var(--lwc-space-3, 12px);
        }

        /* Months are chapters: each opens with a heading band in the title
           band's colours that stays in view while its events scroll past. */
        .event-board-page .events-board tbody tr.events-month-row {
            display: block;
            position: sticky;
            top: var(--event-month-top);
            z-index: 3;
        }

        .event-board-page .events-board tbody tr.events-month-row > th {
            display: flex;
            align-items: center;
            box-sizing: border-box;
            min-height: 40px;
            padding: var(--lwc-space-2, 8px) var(--feed-pad-x);
            border-block: 1px solid var(--events-border);
            background: var(--events-header-bg);
            color: var(--events-header-ink);
            font-size: var(--lwc-type-xs, .75rem);
            font-weight: 700;
            letter-spacing: .12em;
            line-height: 1.3;
            text-align: left;
            text-transform: uppercase;
        }

        .event-board-page .events-board tbody tr.events-month-row:first-child > th {
            border-top: 0;
        }

        .event-board-page .events-board tbody tr.events-month-row + tr.main-row {
            --timeline-row-top: var(--lwc-space-2, 8px);
            padding-top: var(--timeline-row-top);
        }

        /* Loading shows the first heading band before the first events. */
        .event-board-page .events-board[aria-busy="true"] tbody::before {
            content: "";
            display: block;
            height: 40px;
            border-bottom: 1px solid var(--events-border);
            background:
                linear-gradient(var(--events-border), var(--events-border)) var(--feed-pad-x) 50% / 7rem .6rem no-repeat,
                var(--events-header-bg);
        }

        /* Rows: date, portrait on the rail, message. */
        .event-board-page .events-board tbody tr.main-row,
        .event-board-page .events-board tbody tr.events-skeleton-row {
            --timeline-row-top: 2px;
            display: grid;
            grid-template-columns: var(--event-date-column) var(--event-avatar-column) minmax(0, 1fr);
            grid-template-areas: "date avatar message";
            align-items: center;
            height: auto;
            min-height: 52px;
            padding: var(--timeline-row-top) var(--feed-pad-x) 2px 0;
            box-sizing: border-box;
        }

        .event-board-page .events-board tbody tr.main-row > td,
        .event-board-page .events-board tbody tr.events-skeleton-row > td {
            display: block;
            box-sizing: border-box;
            width: auto;
            min-width: 0;
            height: auto;
            padding: 0;
        }

        .event-board-page .events-board tbody tr > td.col-avatar {
            grid-area: avatar;
            padding: 0 var(--event-avatar-gap) 0 var(--event-avatar-inset);
        }

        .event-board-page .events-board tbody tr > td.event-message { grid-area: message; padding: 0; }

        .event-board-page .events-board tbody tr > td.col-date {
            grid-area: date;
            width: auto;
            padding: 0 var(--lwc-space-3, 12px) 0 var(--feed-pad-x);
            color: var(--events-muted);
            font-size: var(--lwc-type-xs, .75rem);
            line-height: 1.25;
            text-align: left;
            font-variant-numeric: tabular-nums;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .event-board-page .events-board tbody td.event-message .event-message-cell {
            display: block;
            min-height: 0;
            padding-block: var(--lwc-space-2, 8px);
            font-size: var(--lwc-type-body, 1rem);
            line-height: 1.5;
            white-space: normal;
        }

        .event-board-page .events-board tbody td.event-message .event-message-cell .rank-badge,
        .event-board-page .events-board tbody td.event-message .event-message-cell .badge-class,
        .event-board-page .events-board tbody td.event-message .event-message-cell .badge-chip,
        .event-board-page .events-board tbody td.event-message .event-message-cell .more-link,
        .event-board-page .events-board tbody td.event-message .event-message-cell .event-measurement strong {
            white-space: nowrap;
        }

        /* One quiet surface: days group events, not alternating stripes. */
        .event-board-page .events-board table tbody tr,
        .event-board-page .events-board table tbody tr.zebra-even,
        .event-board-page .events-board table tbody tr.zebra-odd {
            background-color: transparent;
            box-shadow: none;
            transform: none;
        }

        .event-board-page .events-board table tbody tr.main-row,
        .event-board-page .events-board table tbody tr.events-skeleton-row,
        .event-board-page .events-board table tbody tr.custom-event-details {
            background-image: var(--event-rail);
            background-repeat: no-repeat;
            background-position: var(--event-rail-x) 0;
            background-size: 2px 100%;
        }

        .event-board-page .events-board table tbody tr.main-row:hover,
        .event-board-page .events-board table tbody tr.main-row:focus-within,
        .event-board-page .events-board table tbody tr.custom-event-row:has(+ tr.custom-event-details:hover) {
            background-color: var(--events-hover-bg);
        }

        /* Each month has its own rail, from its newest portrait to its oldest. */
        .event-board-page .events-board table tbody tr.events-skeleton-row:first-child,
        .event-board-page .events-board table tbody tr.main-row.month-start {
            background-position: var(--event-rail-x) 100%;
            background-size: 2px calc(50% - (var(--timeline-row-top, 2px) - 2px) / 2);
        }

        .event-board-page .events-board table tbody tr.events-skeleton-row:last-child,
        .event-board-page .events-board table tbody tr.main-row.month-end {
            background-position: var(--event-rail-x) 0;
            background-size: 2px calc(50% + (var(--timeline-row-top, 2px) - 2px) / 2);
        }

        .event-board-page .events-board table tbody tr.main-row.month-start.month-end,
        .event-board-page .events-board table tbody tr.main-row.month-end + tr.custom-event-details {
            background-image: none;
        }

        /* The day leads its events in ink; its month is the chapter's heading. */
        .event-board-page .events-board tbody tr.main-row > td.col-date {
            color: var(--events-text);
            opacity: 1;
        }

        @media (min-width: 601px) {
            .event-board-page .events-board td.col-date .event-date-day {
                display: block;
                font-size: 1.375rem;
                font-weight: 700;
                line-height: 1;
                letter-spacing: -.01em;
            }

            .event-board-page .events-board td.col-date .event-date-rest,
            .event-board-page .events-board tbody tr.main-row.day-repeat > td.col-date .event-date-day {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
        }

        .event-board-page .events-board tbody tr.main-row.day-repeat > td.col-date {
            color: var(--events-muted);
        }

        /* Portraits sit on the rail with a ring of the card around them. */
        .event-board-page .events-board .avatar,
        .event-board-page .events-board .avatar-fallback,
        .event-board-page .events-board .avatar-link:is(:hover, :focus) .avatar,
        .event-board-page .events-board .avatar-link:is(:hover, :focus) .avatar-fallback,
        .event-board-page .events-board .donation-gift-avatar,
        .event-board-page .events-board .milestone-people-avatar {
            width: var(--event-avatar-size);
            height: var(--event-avatar-size);
            box-sizing: border-box;
            box-shadow: 0 0 0 4px var(--card-bg);
        }

        .event-board-page .events-board .avatar-fallback {
            font-size: min(.7rem, 14px);
            line-height: 1;
            white-space: nowrap;
        }

        .event-board-page .events-board .donation-gift-avatar i,
        .event-board-page .events-board .milestone-people-avatar i {
            font-size: min(1rem, 16px);
        }

        .event-board-page .events-board .athlete-td {
            min-height: 0;
            padding: 0;
        }

        /* Announcements: the chevron belongs to its title, and the opened
           story is a panel that starts where the message starts. */
        .event-board-page .events-board .custom-event-title {
            font-weight: 700;
        }

        .event-board-page .events-board table tbody tr.custom-event-row:not(.custom-event-no-details) td.event-message .event-message-cell {
            padding-right: 0;
        }

        .event-board-page .events-board table tbody tr.custom-event-row:not(.custom-event-no-details) .custom-event-expander {
            position: relative;
            inset: auto;
            margin: -10px 0 -10px var(--lwc-space-1, 4px);
            vertical-align: middle;
        }

        .event-board-page .events-board .custom-event-expander::after {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid var(--events-border);
            border-radius: 50%;
            transition: border-color var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
        }

        .event-board-page .events-board .custom-event-expander:hover::after,
        .event-board-page .events-board tr.custom-event-row.is-open .custom-event-expander::after {
            border-color: var(--secondary-color, #087685);
        }

        .event-board-page .events-board tbody tr.custom-event-details,
        .event-board-page .events-board tbody tr.custom-event-row.is-open + tr.custom-event-details {
            display: block;
        }

        .event-board-page .events-board tbody tr.custom-event-details > td.details-cell {
            display: block;
            /* Closed, the row has no height; opened, the content brings its own spacing. */
            padding: 0 var(--feed-pad-x) 0 var(--event-message-start);
            border: 0;
            background: transparent;
        }

        .event-board-page .events-board tbody tr.custom-event-row.is-open + tr.custom-event-details .custom-event-content {
            padding: 0 0 var(--lwc-space-4, 16px);
        }

        .event-board-page .events-board .custom-event-body {
            box-sizing: border-box;
            border-radius: var(--lwc-radius-md, 8px);
            background: var(--details-bg);
            box-shadow: inset 3px 0 0 var(--custom-event-accent);
        }

        .event-board-page .events-board tbody tr.custom-event-row.is-open + tr.custom-event-details .custom-event-body {
            padding: var(--lwc-space-4, 16px) var(--lwc-space-4, 16px) var(--lwc-space-4, 16px) var(--lwc-space-5, 20px);
        }

        .event-board-page .events-board .custom-event-artwork img {
            border-radius: var(--lwc-radius-md, 8px);
        }

        /* Loading: the skeleton has the anatomy of a real day. */
        .event-board-page .events-board .events-skeleton-avatar {
            width: var(--event-avatar-size);
            height: var(--event-avatar-size);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 4px var(--card-bg) !important;
        }

        .event-board-page .events-board tr.events-skeleton-row > td.col-date::before {
            content: "";
            display: block;
            width: 3rem;
            height: .6rem;
            border-radius: var(--lwc-radius-pill, 999px);
            background: var(--events-border);
            opacity: .7;
        }

        .event-board-page .events-board tr.events-skeleton-row:not(:first-child) > td.col-date::before {
            opacity: .35;
        }

        .event-board-page .events-board tr.events-skeleton-row .event-message-cell {
            display: flex;
            flex-direction: column;
            gap: var(--lwc-space-2, 8px);
            padding-block: var(--lwc-space-3, 12px);
        }

        .event-board-page .events-board tr.events-skeleton-row .event-message-cell::after {
            content: "";
            display: block;
            width: 38%;
            height: 10px;
            border-radius: var(--lwc-radius-pill, 999px);
            background: var(--events-border);
            opacity: .55;
        }

        .event-board-page .events-board tr.events-skeleton-row .events-skeleton-line {
            flex: 0 0 auto;
            width: 72%;
            height: 12px;
        }

        .event-board-page .events-board tr.events-skeleton-row:nth-child(2n) .events-skeleton-line { width: 56%; }
        .event-board-page .events-board tr.events-skeleton-row:nth-child(3n) .events-skeleton-line { width: 84%; }
        .event-board-page .events-board tr.events-skeleton-row:nth-child(2n) .event-message-cell::after { width: 24%; }

        .event-board-page .events-board tbody tr.events-skeleton-row:hover {
            background-color: transparent !important;
        }

        /* Empty and failed feeds keep the card's shape and speak from its middle. */
        .event-board-page .events-board tbody tr.events-empty-row,
        .event-board-page .events-board tbody tr.events-empty-row > td {
            display: block;
        }

        .event-board-page .events-board tbody tr.events-empty-row > td,
        .event-board-page .events-board tbody tr:has(.events-recovery) > td {
            display: block;
            padding: var(--lwc-space-7, 48px) var(--feed-pad-x);
            color: var(--events-muted);
            font-size: var(--lwc-type-body, 1rem);
            text-align: center;
        }

        .event-board-page .events-board tbody tr:has(.events-recovery),
        .event-board-page .events-board tbody tr.events-empty-row {
            display: block;
            background: transparent !important;
        }

        .event-board-page .events-board tbody tr.events-empty-row > td::before {
            content: "\f135";
            display: grid;
            place-items: center;
            width: 64px;
            height: 64px;
            margin: 0 auto var(--lwc-space-4, 16px);
            border: 1px solid var(--events-border);
            border-radius: 50%;
            background: var(--events-header-bg);
            color: var(--events-header-action);
            font-family: "Font Awesome 6 Free";
            font-size: 1.5rem;
            font-weight: 900;
            line-height: 1;
        }

        /* A failed load keeps the site's notice, set as one line in the card. */
        .event-board-page .events-board .events-recovery {
            justify-content: space-between;
            gap: var(--lwc-space-3, 12px) var(--lwc-space-4, 16px);
            min-height: 0;
            max-width: 32rem;
            margin: 0 auto;
            padding: var(--lwc-space-3, 12px) var(--lwc-space-3, 12px) var(--lwc-space-3, 12px) var(--lwc-space-4, 16px);
            text-align: left;
        }

        .event-board-page .events-board .events-recovery p {
            color: var(--events-text);
            font-weight: 700;
        }

        .event-board-page .events-board .events-retry-button {
            min-width: min(8rem, 100%);
            max-width: 100%;
            border-color: var(--lwc-border, #b7c7cd);
            border-radius: var(--lwc-radius-md, 8px);
            color: var(--secondary-color, #087685);
        }

        .event-board-page .events-board .events-retry-button:hover {
            border-color: var(--secondary-color, #087685);
        }

        /* Back closes the column at the card's own edge. */
        .event-board-page .options-container {
            align-items: flex-start;
            width: var(--feed-width);
            margin: var(--lwc-space-5, 24px) auto 0;
        }

        .event-board-page .options-container .back-button {
            width: auto;
            min-width: 9rem;
            margin: 0;
        }

        /* Tablets: the date column narrows, everything else keeps its place. */
        @media (max-width: 820px) {
            main.event-board-page {
                --feed-pad-x: var(--lwc-space-4, 16px);
            }

            .event-board-page .events-board {
                --event-date-column: 4rem;
            }
        }

        /* Phones: portrait and rail lead, the date sits under its message. */
        @media (max-width: 600px) {
            main.event-board-page {
                --feed-width: 100%;
                --feed-pad-x: var(--lwc-space-3, 12px);
                --feed-clearance: var(--lwc-space-4, 16px);
                /* Enlarged text: the side space stops growing with the text so
                   the message keeps its width. */
                padding-inline: min(1rem, 4vw);
            }

            .event-board-heading {
                padding-inline: var(--lwc-space-4, 16px);
            }

            .event-board-heading h1 { font-size: clamp(1.5rem, 7vw, 2rem); }

            .event-board-page .events-board {
                --event-date-column: 0px;
                --event-avatar-inset: var(--lwc-space-1, 4px);
                --event-avatar-gap: var(--lwc-space-2, 8px);
            }

            .event-board-page .events-board tbody tr.main-row,
            .event-board-page .events-board tbody tr.events-skeleton-row {
                --timeline-row-top: var(--lwc-space-2, 8px);
                /* Row padding, cell inset, half a portrait. */
                --event-rail-top: calc(var(--timeline-row-top) + 2px + var(--event-avatar-size) / 2);
                grid-template-columns: var(--event-avatar-column) minmax(0, 1fr);
                grid-template-areas:
                    "avatar message"
                    "avatar date";
                align-items: start;
                padding: var(--timeline-row-top) min(var(--lwc-space-4, 16px), 4vw) var(--lwc-space-2, 8px) 0;
            }

            .event-board-page .events-board tbody tr.main-row > td.col-avatar,
            .event-board-page .events-board tbody tr.events-skeleton-row > td.col-avatar {
                align-self: start;
                padding-top: 2px;
            }

            .event-board-page .events-board .athlete-td {
                align-items: flex-start;
            }

            .event-board-page .events-board .avatar-link,
            .event-board-page .events-board .avatar-disabled {
                align-items: flex-start;
                min-height: 44px;
                padding-top: 0;
            }

            .event-board-page .events-board tbody tr.main-row > td.event-message .event-message-cell {
                padding-block: 0;
            }

            .event-board-page .events-board tbody tr > td.col-date,
            .event-board-page .events-board:not(.athlete-scroll) tbody tr > td.col-date {
                display: block;
                width: auto;
                padding: 2px 0 0;
                font-size: var(--lwc-type-xs, .75rem);
                line-height: 1.3;
            }

            .event-board-page .events-board tbody tr > td.col-date:empty {
                display: none;
            }

            .event-board-page .events-board tr.events-skeleton-row > td.col-date::before {
                margin-top: var(--lwc-space-1, 4px);
            }

            /* The rail meets each portrait's centre, which now sits near the row's top. */
            .event-board-page .events-board table tbody tr.events-skeleton-row:first-child,
            .event-board-page .events-board table tbody tr.main-row.month-start {
                background-position: var(--event-rail-x) var(--event-rail-top);
                background-size: 2px 100%;
            }

            .event-board-page .events-board table tbody tr.events-skeleton-row:last-child,
            .event-board-page .events-board table tbody tr.main-row.month-end {
                background-position: var(--event-rail-x) 0;
                background-size: 2px var(--event-rail-top);
            }

            .event-board-page .events-board tbody tr.events-month-row + tr.main-row {
                --timeline-row-top: var(--lwc-space-3, 12px);
            }

            .event-board-page .options-container .back-button {
                width: 100%;
                max-width: none;
            }

            .event-board-page .events-board tbody tr.custom-event-details > td.details-cell {
                padding-right: min(var(--lwc-space-4, 16px), 4vw);
            }

            .event-board-page .events-board tbody tr.custom-event-row.is-open + tr.custom-event-details .custom-event-content {
                padding-top: var(--lwc-space-2, 8px);
            }

            .event-board-page .events-board tbody tr.custom-event-row.is-open + tr.custom-event-details .custom-event-body {
                padding: var(--lwc-space-3, 12px) var(--lwc-space-3, 12px) var(--lwc-space-3, 12px) var(--lwc-space-4, 16px);
            }
        }
    </style>
</head>
<body>
<!--HEADER-->
<main class="event-board-page">
    <div class="event-board-heading">
        <h1 id="eventBoardTitle">Highlights</h1>
        <div class="event-board-actions">
            <a class="event-feed-link" href="/feeds/events.rss" aria-label="Subscribe to Highlights via RSS" title="Subscribe via RSS">
                <i class="fas fa-rss" aria-hidden="true"></i><span>RSS</span>
            </a>
            <button id="webPushToggle" class="event-push-toggle" type="button" aria-label="Get announcement notifications" aria-pressed="false" hidden>
                <i class="fas fa-bell" aria-hidden="true"></i>
            </button>
        </div>
        <p id="webPushStatus" class="event-push-status" role="status" aria-live="polite"></p>
    </div>
    <script src="{{ASSET_WEB_PUSH_JS}}" data-worker-url="{{ASSET_WEB_PUSH_WORKER_JS}}"></script>
    <!--EVENT-BOARD-CONTENT-->
    <div class="options-container" data-aos="fade" data-aos-duration="700" data-aos-delay="700">
        <button class="option-button back-button" onclick="history.length > 1 ? history.back() : window.location.assign('/')">
            <i class="fas fa-arrow-left"></i>&nbsp;Back
        </button>
    </div>
</main>
<!--FOOTER-->

<script>
    history.replaceState({}, '', '/events' + (window.location.search || '') + (window.location.hash || ''));

    function initEventBoard() {
        const headingEl = document.querySelector('.event-board-heading');
        const requestedEventId = new URLSearchParams(window.location.search).get('event')?.trim();
        if (headingEl && headingEl.scrollIntoView && !requestedEventId) {
            const interactions = ['pointerdown', 'touchstart', 'wheel', 'keydown'];
            let scrollTimer;
            const cancelOpeningScroll = () => {
                window.clearTimeout(scrollTimer);
                interactions.forEach(type => window.removeEventListener(type, cancelOpeningScroll));
            };
            interactions.forEach(type => window.addEventListener(type, cancelOpeningScroll, { once: true, passive: true }));
            scrollTimer = window.setTimeout(() => {
                cancelOpeningScroll();
                const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth';
                headingEl.scrollIntoView({ behavior, block: 'start' });
            }, 500);
        }
        if (typeof window.loadEventsTable === 'function') {
            window.loadEventsTable(Infinity, false);
        } else {
            console.error('loadEventsTable is not defined');
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initEventBoard);
    } else {
        initEventBoard();
    }
</script>
</body>
</html>
