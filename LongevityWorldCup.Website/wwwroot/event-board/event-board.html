<!DOCTYPE html>
<html lang="en">
<head>
    <title>Longevity World Cup - Event board</title>
    <!--HEAD-->
    <link rel="stylesheet" href="{{ASSET_HIGHLIGHTS_PAGE_CSS}}">
</head>
<body>
<!--HEADER-->
<main class="event-board-page">
    <div class="event-board-heading">
        <h1 id="eventBoardTitle">Highlights</h1>
        <div class="event-board-actions">
            <a class="event-feed-link" href="/feeds/events.rss" aria-label="Subscribe to Highlights via RSS" title="Subscribe via RSS">
                <i class="fas fa-rss" aria-hidden="true"></i><span>RSS</span>
            </a>
            <button id="webPushToggle" class="event-push-toggle" type="button" aria-label="Get announcement notifications" aria-pressed="false" hidden>
                <i class="fas fa-bell" aria-hidden="true"></i>
            </button>
        </div>
        <p id="webPushStatus" class="event-push-status" role="status" aria-live="polite"></p>
    </div>
    <script src="{{ASSET_WEB_PUSH_SYNC_JS}}"></script>
    <script src="{{ASSET_WEB_PUSH_JS}}" data-worker-url="{{ASSET_WEB_PUSH_WORKER_JS}}"></script>
    <!--EVENT-BOARD-CONTENT-->
    <div class="options-container" data-aos="fade" data-aos-duration="700" data-aos-delay="700">
        <button class="option-button back-button" onclick="history.length > 1 ? history.back() : window.location.assign('/')">
            <i class="fas fa-arrow-left"></i>&nbsp;Back
        </button>
    </div>
</main>
<!--FOOTER-->

<script>
    history.replaceState(history.state, '', '/events' + (window.location.search || '') + (window.location.hash || ''));

    function initEventBoard() {
        const headingEl = document.querySelector('.event-board-heading');
        const requestedEventId = new URLSearchParams(window.location.search).get('event')?.trim();
        const returning = performance.getEntriesByType('navigation')[0]?.type === 'back_forward';
        if (headingEl && headingEl.scrollIntoView && !requestedEventId && !returning) {
            const interactions = ['pointermove', 'pointerdown', 'touchstart', 'wheel', 'keydown', 'focusin'];
            let scrollTimer, cleanupTimer, scrolling = false;
            const finishOpeningScroll = () => {
                window.clearTimeout(scrollTimer);
                window.clearTimeout(cleanupTimer);
                interactions.forEach(type => window.removeEventListener(type, cancelOpeningScroll));
            };
            const cancelOpeningScroll = () => {
                finishOpeningScroll();
                if (scrolling) window.scrollTo({ left: window.scrollX, top: window.scrollY, behavior: 'instant' });
            };
            interactions.forEach(type => window.addEventListener(type, cancelOpeningScroll, { once: true, passive: true }));
            scrollTimer = window.setTimeout(() => {
                const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth';
                if (behavior === 'smooth') {
                    scrolling = true;
                    // Keep the cancellation window through the animation. A queued
                    // scrollend from earlier positioning may arrive after it starts.
                    cleanupTimer = window.setTimeout(finishOpeningScroll, 1500);
                } else finishOpeningScroll();
                headingEl.scrollIntoView({ behavior, block: 'start' });
            }, 500);
        }
        if (typeof window.loadEventsTable === 'function') {
            window.loadEventsTable(Infinity, false);
        } else {
            console.error('loadEventsTable is not defined');
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initEventBoard);
    } else {
        initEventBoard();
    }
</script>
<script>
    // Reading the day: the pinned month band shows the day under the reader's
    // eye and rolls it as days pass; events from the last day are marked fresh.
    (function () {
        const board = () => document.querySelector('.event-board-page .events-board');
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
        const DAY = 86400000;
        let frame = 0;
        let lastRow = null;

        function chipFor(band) {
            const th = band.querySelector('th');
            if (!th) return null;
            let chip = th.querySelector('.events-day-chip');
            if (!chip) {
                chip = document.createElement('span');
                chip.className = 'events-day-chip';
                chip.setAttribute('aria-hidden', 'true');
                th.appendChild(chip);
            }
            return chip;
        }

        function setDay(chip, day, direction) {
            if (chip.dataset.day === day) return;
            const previous = chip.dataset.day;
            chip.dataset.day = day;
            const next = document.createElement('span');
            next.textContent = String(Number(day.split("-").pop()));
            chip.replaceChildren(next);
            if (previous && !reduced.matches) {
                next.animate([
                    { transform: `translateY(${direction * 100}%)`, opacity: 0 },
                    { transform: 'none', opacity: 1 }
                ], { duration: 220, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
            }
        }

        function update() {
            frame = 0;
            const root = board();
            if (!root) return;
            root.querySelectorAll('tbody[data-month]').forEach(tbody => {
                const band = tbody.querySelector('tr.events-month-row');
                if (!band) return;
                const chip = chipFor(band);
                if (!chip) return;
                const bandBottom = band.getBoundingClientRect().bottom;
                const rows = tbody.querySelectorAll('tr.main-row[data-day]');
                let current = null;
                for (const row of rows) {
                    const box = row.getBoundingClientRect(); if (box.top + box.height / 2 > bandBottom) { current = row; break; }
                }
                if (!band.classList.contains('is-pinned') || !current) return;
                const order = Array.prototype.indexOf.call(rows, current);
                const lastOrder = lastRow && lastRow.parentElement === tbody ? Array.prototype.indexOf.call(rows, lastRow) : order;
                setDay(chip, current.dataset.day, order >= lastOrder ? 1 : -1);
                if (lastRow !== current) {
                    lastRow?.classList.remove('is-current-day');
                    current.classList.add('is-current-day');
                    lastRow = current;
                }
            });
        }

        function markFresh() {
            const root = board();
            if (!root) return;
            const now = Date.now();
            root.querySelectorAll('tr.main-row:not([data-fresh-checked])').forEach(row => {
                row.dataset.freshChecked = '';
                const stamp = Date.parse(row.querySelector('time[datetime]')?.getAttribute('datetime') || '');
                if (Number.isFinite(stamp) && now - stamp < DAY) row.classList.add('is-fresh');
            });
        }

        function schedule() {
            if (!frame) frame = requestAnimationFrame(update);
        }

        function start() {
            const root = board();
            if (!root) return;
            new MutationObserver(() => { markFresh(); schedule(); }).observe(root, { childList: true, subtree: true });
            markFresh();
            window.addEventListener('scroll', schedule, { passive: true });
            window.addEventListener('resize', schedule, { passive: true });
            schedule();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
        else start();
    })();
</script>
</body>
</html>
