<!DOCTYPE html>
<html lang="en">
<head>
    <title>Longevity World Cup - Event board</title>
    <!--HEAD-->
    <style>
        .join-game {
            display: none !important;
        }

        .event-board-heading {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--lwc-space-3, 12px);
            margin: 0 auto var(--lwc-space-4, 16px);
            /* The page scrolls this heading to the sticky header; the padding keeps the title clear of it. */
            padding-top: var(--lwc-space-5, 24px);
            box-sizing: border-box;
        }

        .event-board-heading h1 { flex: 1 1 max-content; min-width: 0; margin: 0; line-height: 1.1; text-align: left; }

        .event-board-actions {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            max-width: 100%;
            gap: var(--lwc-space-3, 12px);
            margin-left: auto;
        }

        .event-feed-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--lwc-space-2, 8px);
            min-height: 44px;
            flex-shrink: 0;
            padding: 0 var(--lwc-space-4, 16px);
            border: 1px solid var(--lwc-border, #b7c7cd);
            border-radius: var(--lwc-radius-md, 8px);
            background: var(--lwc-surface, #fff);
            color: var(--secondary-color, #087685);
            font-size: var(--lwc-type-sm, .875rem);
            font-weight: 700;
            text-decoration: none;
        }

        .event-feed-link:hover { background: var(--lwc-surface-muted, #eef2f5); }
        .event-feed-link:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }

        .event-push-toggle {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid var(--lwc-border, #b7c7cd);
            border-radius: 50%;
            background: transparent;
            color: var(--secondary-color, #087685);
            font: inherit;
            cursor: pointer;
        }
        .event-push-toggle[hidden] { display: none; }
        .event-push-toggle[aria-pressed="true"] { background: var(--secondary-color, #087685); color: #fff; border-color: transparent; }
        .event-push-toggle:hover { box-shadow: 0 0 0 3px var(--lwc-surface-muted, #eef2f5); }
        .event-push-toggle:focus-visible { outline: 2px solid var(--secondary-color, #087685); outline-offset: 3px; }
        .event-push-toggle:disabled { opacity: .55; cursor: default; }
        .event-push-status { font-size: var(--lwc-type-sm, .875rem); text-align: center; max-width: 32rem; margin: 0 auto 12px; }
        .event-push-status:empty { display: none; }

        .event-board-page .events-board thead {
            display: none;
        }

        .event-board-page .events-board table {
            padding-bottom: 0;
        }

        .event-board-page .events-board col.events-col-date {
            width: 106px;
        }

        .event-board-page .events-board td.col-date {
            width: 106px;
            white-space: normal;
            line-height: 1.15;
        }

        /* The feed reads at a column's width, not the screen's: each event's
           date, face and message stay together instead of trailing into empty
           space across a 1080px card. */
        @media (min-width: 720px) {
            .event-board-heading,
            .event-board-page .events-board {
                width: min(100% - 2rem, 860px);
            }

            .event-board-page .events-board {
                flex-grow: 0;
                --event-avatar-target: 44px;
            }

            .event-board-page .events-board tbody td.col-avatar {
                padding-left: var(--event-avatar-inset);
                padding-right: var(--event-avatar-gap);
            }

            .event-board-page .events-board .avatar,
            .event-board-page .events-board .avatar-fallback {
                width: 32px;
                height: 32px;
            }
        }

        /* Initials stay inside the fixed-size portrait when the surrounding text grows. */
        .event-board-page .events-board .avatar-fallback {
            font-size: min(.7rem, 11.2px);
            white-space: nowrap;
        }

        @media (max-width: 600px), (min-width: 720px) {
            .event-board-page .events-board .avatar-fallback {
                font-size: min(.7rem, 14px);
            }
        }

        @media (min-width: 601px) and (max-width: 820px) {
            .event-board-page .events-board {
                --event-avatar-inset: 12px;
            }

            .event-board-page .events-board table {
                width: 100%;
                table-layout: fixed;
            }

            .event-board-page .events-board col.events-col-date {
                width: 96px;
            }

            .event-board-page .events-board tbody td {
                padding-left: 12px;
                padding-right: 12px;
            }

            .event-board-page .events-board td.event-message {
                padding-left: 0;
            }

            .event-board-page .events-board td.event-message .event-message-cell {
                display: block;
                white-space: normal;
                overflow: visible;
                flex-wrap: wrap;
                column-gap: 0.2rem;
                row-gap: 0.16rem;
                padding-top: 0.3rem;
                padding-bottom: 0.3rem;
            }

            .event-board-page .events-board td.event-message .event-message-cell * {
                white-space: normal;
            }

            .event-board-page .events-board td.event-message .event-message-cell .rank-badge,
            .event-board-page .events-board td.event-message .event-message-cell .badge-class,
            .event-board-page .events-board td.event-message .event-message-cell .badge-chip,
            .event-board-page .events-board td.event-message .event-message-cell .more-link {
                white-space: nowrap;
            }

            .event-board-page .events-board td.event-message .event-message-cell .event-measurement {
                white-space: nowrap;
            }

            .event-board-page .events-board td.col-date {
                width: 96px;
                padding-left: 8px;
                font-size: 0.76rem;
                white-space: normal;
                line-height: 1.15;
            }
        }

        @media (min-width: 421px) and (max-width: 600px) {
            .event-board-page .events-board:not(.athlete-scroll) col.events-col-date {
                width: 86px;
            }

            .event-board-page .events-board:not(.athlete-scroll) td.col-date {
                width: 86px;
                padding-left: 8px;
                white-space: normal;
                line-height: 1.15;
            }
        }

        /* The page reads as a timeline: every row keeps its date beside the
           portrait (beneath the message on phones), so the date belongs to
           its event instead of sitting at the far edge or disappearing. */
        .event-board-page .events-board {
            --event-date-column: 5.5rem;
            --event-avatar-inset: 0px;
            --event-message-start: calc(var(--event-date-column) + var(--event-avatar-column));
        }

        .event-board-page .events-board table,
        .event-board-page .events-board tbody {
            display: block;
            width: 100%;
        }

        .event-board-page .events-board colgroup {
            display: none;
        }

        .event-board-page .events-board tbody tr.main-row,
        .event-board-page .events-board tbody tr.events-skeleton-row {
            display: grid;
            grid-template-columns: var(--event-date-column) var(--event-avatar-column) minmax(0, 1fr);
            grid-template-areas: "date avatar message";
            align-items: center;
            height: auto;
            min-height: 48px;
        }

        .event-board-page .events-board tbody tr.main-row > td,
        .event-board-page .events-board tbody tr.events-skeleton-row > td {
            display: block;
            box-sizing: border-box;
            width: auto;
            min-width: 0;
            height: auto;
        }

        .event-board-page .events-board tbody tr > td.col-avatar { grid-area: avatar; }
        .event-board-page .events-board tbody tr > td.event-message { grid-area: message; padding-right: var(--lwc-space-4, 16px); }

        .event-board-page .events-board tbody tr > td.col-date {
            grid-area: date;
            width: auto;
            padding: 0 var(--lwc-space-3, 12px) 0 var(--lwc-space-4, 16px);
            font-variant-numeric: tabular-nums;
            text-align: left;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        /* An announcement's chevron belongs to its title, not the board's far edge. */
        .event-board-page .events-board table tbody tr.custom-event-row:not(.custom-event-no-details) td.event-message .event-message-cell {
            padding-right: 0;
        }

        .event-board-page .events-board table tbody tr.custom-event-row:not(.custom-event-no-details) .custom-event-expander {
            position: relative;
            inset: auto;
            margin: -10px 0 -10px var(--lwc-space-1, 4px);
            vertical-align: middle;
        }

        /* Opened details start where the message text starts. */
        .event-board-page .events-board tbody tr.custom-event-details,
        .event-board-page .events-board tbody tr.custom-event-row.is-open + tr.custom-event-details {
            display: block;
        }

        .event-board-page .events-board tbody tr.custom-event-details > td.details-cell {
            display: block;
            /* Closed, the row has no height; opened, the content brings its own spacing. */
            padding: 0 var(--lwc-space-4, 16px) 0 var(--event-message-start);
        }

        .event-board-page .events-board tbody tr.events-empty-row,
        .event-board-page .events-board tbody tr.events-empty-row > td {
            display: block;
        }

        @media (max-width: 600px) {
            .event-board-heading h1 { font-size: clamp(1.5rem, 8vw, 2rem); }

            .event-board-page .events-board {
                --event-date-column: 0px;
                --event-avatar-inset: 12px;
            }

            .event-board-page .events-board tbody tr.main-row,
            .event-board-page .events-board tbody tr.events-skeleton-row {
                grid-template-columns: var(--event-avatar-column) minmax(0, 1fr);
                grid-template-areas:
                    "avatar message"
                    "avatar date";
                padding-block: var(--lwc-space-2, 8px);
            }

            .event-board-page .events-board tbody tr.main-row > td.event-message .event-message-cell {
                min-height: 0;
                padding-block: 0;
            }

            .event-board-page .events-board tbody tr > td.col-date,
            .event-board-page .events-board:not(.athlete-scroll) tbody tr > td.col-date {
                display: block;
                width: auto;
                padding: 2px var(--lwc-space-3, 12px) 0 0;
                font-size: var(--lwc-type-xs, .75rem);
                line-height: 1.3;
            }

            .event-board-page .events-board tbody tr > td.col-date:empty {
                display: none;
            }

            /* Enlarged text: the side space stops growing with the text so the
               message keeps its width. */
            main.event-board-page {
                padding-inline: min(1rem, 5vw);
            }

            .event-board-page .events-board tbody tr > td.event-message {
                padding-right: min(var(--lwc-space-4, 16px), 5vw);
            }
        }
    </style>
</head>
<body>
<!--HEADER-->
<main class="event-board-page">
    <div class="event-board-heading">
        <h1 id="eventBoardTitle">Highlights</h1>
            <div class="event-board-actions">
        <a class="event-feed-link" href="/feeds/events.rss" aria-label="Subscribe to Highlights via RSS" title="Subscribe via RSS">
            <i class="fas fa-rss" aria-hidden="true"></i><span>RSS</span>
        </a>
        <button id="webPushToggle" class="event-push-toggle" type="button" aria-label="Get announcement notifications" aria-pressed="false" hidden>
            <i class="fas fa-bell" aria-hidden="true"></i>
        </button>
            </div>
    </div>
    <p id="webPushStatus" class="event-push-status" role="status" aria-live="polite"></p>
    <script src="{{ASSET_WEB_PUSH_JS}}" data-worker-url="{{ASSET_WEB_PUSH_WORKER_JS}}"></script>
    <!--EVENT-BOARD-CONTENT-->
    <div class="options-container" data-aos="fade" data-aos-duration="700" data-aos-delay="700">
        <button class="option-button back-button" onclick="window.goBackOrHome()">
            <i class="fas fa-arrow-left"></i>&nbsp;Back
        </button>
    </div>
</main>
<!--FOOTER-->

<script>
    history.replaceState({}, '', '/events' + (window.location.search || '') + (window.location.hash || ''));

    function initEventBoard() {
        const headingEl = document.querySelector('.event-board-heading');
        if (headingEl && headingEl.scrollIntoView) {
            setTimeout(() => {
                const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth';
                headingEl.scrollIntoView({ behavior, block: 'start' });
            }, 500);
        }
        if (typeof window.loadEventsTable === 'function') {
            window.loadEventsTable(Infinity, false);
        } else {
            console.error('loadEventsTable is not defined');
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initEventBoard);
    } else {
        initEventBoard();
    }
</script>
</body>
</html>
