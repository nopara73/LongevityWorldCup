<div class="lwc-merch-mobile-carousel" id="lwc-merch-mobile-carousel">
    <div class="lwc-merch-mobile-track">
        <a class="lwc-merch-mobile-slide is-active"
           href="https://merch.longevityworldcup.com/product/white-glossy-mug/"
           target="_blank"
           rel="noopener"
           aria-label="Open White glossy mug in the Longevity World Cup merch store">
            <img class="lwc-merch-thumb"
                 src="{{ASSET_MERCH_MUG}}"
                 alt="White glossy mug in the Longevity World Cup merch store"
                 width="428" height="487" loading="lazy" decoding="async">
            <span class="lwc-merch-item-copy">
                <span class="lwc-merch-item-title">White glossy mug</span>
                <span class="lwc-merch-item-price">$19.50 - $29.50</span>
            </span>
        </a>
        <a class="lwc-merch-mobile-slide"
           href="https://merch.longevityworldcup.com/product/organic-cotton-hoodie/"
           target="_blank"
           rel="noopener"
           aria-label="Open Organic cotton hoodie in the Longevity World Cup merch store">
            <img class="lwc-merch-thumb"
                 src="{{ASSET_MERCH_HOODIE}}"
                 alt="Organic cotton hoodie in the Longevity World Cup merch store"
                 width="428" height="487" loading="lazy" decoding="async">
            <span class="lwc-merch-item-copy">
                <span class="lwc-merch-item-title">Organic cotton hoodie</span>
                <span class="lwc-merch-item-price">$94.00</span>
            </span>
        </a>
        <a class="lwc-merch-mobile-slide"
           href="https://merch.longevityworldcup.com/product/organic-cotton-cap/"
           target="_blank"
           rel="noopener"
           aria-label="Open Organic cotton cap in the Longevity World Cup merch store">
            <img class="lwc-merch-thumb"
                 src="{{ASSET_MERCH_CAP}}"
                 alt="Organic cotton cap in the Longevity World Cup merch store"
                 width="428" height="487" loading="lazy" decoding="async">
            <span class="lwc-merch-item-copy">
                <span class="lwc-merch-item-title">Organic cotton cap</span>
                <span class="lwc-merch-item-price">$37.00</span>
            </span>
        </a>
    </div>
    <div class="lwc-merch-mobile-dots" inert>
        <button type="button" class="lwc-merch-mobile-dot is-active" aria-label="Show merch product 1"></button>
        <button type="button" class="lwc-merch-mobile-dot" aria-label="Show merch product 2"></button>
        <button type="button" class="lwc-merch-mobile-dot" aria-label="Show merch product 3"></button>
    </div>
</div>
