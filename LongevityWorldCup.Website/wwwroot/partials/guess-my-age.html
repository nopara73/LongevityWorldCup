<style>
    /* Result feedback stays compact, but it should still feel like a game payoff. */
    .gma-pop-banner {
        position: fixed;
        top: max(1rem, env(safe-area-inset-top));
        left: 50%;
        transform: translate(-50%, -0.75rem) scale(0.96);
        min-height: 48px;
        padding: 0.75rem 1.1rem;
        background: var(--lwc-surface, #ffffff);
        color: var(--lwc-ink, #17212b);
        font-size: 1rem;
        font-weight: 700;
        border: 0;
        border-inline-start: 4px solid var(--lwc-accent, var(--primary-color));
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        z-index: 10002;
        pointer-events: none;
        box-shadow: var(--lwc-shadow-md, 0 10px 28px rgba(15, 23, 42, 0.18));
    }

    .gma-pop-banner__icon {
        display: grid;
        place-items: center;
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 50%;
        background: var(--lwc-accent-soft, #dff5f7);
        color: var(--lwc-accent, #087685);
        font-size: 0.9rem;
    }

    .gma-pop-banner--golden .gma-pop-banner__icon {
        background: rgba(154, 103, 0, 0.12);
        color: var(--lwc-warning, #9a6700);
    }

        .gma-pop-banner.show {
            animation: gma-pop-slide-in var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease) forwards;
        }

        .gma-pop-banner.hide {
            animation: gma-pop-slide-out var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease) forwards;
        }

        .gma-pop-banner.gma-pop-banner--golden {
            background: var(--lwc-warning-soft, #fff4bf) !important;
            border-inline-start-color: var(--lwc-warning, #9a6700);
            color: var(--lwc-ink, #5f4500) !important;
            box-shadow: var(--lwc-shadow-md, 0 10px 28px rgba(15, 23, 42, 0.18));
        }

    @keyframes gma-pop-slide-in {
        from {
            transform: translate(-50%, -0.75rem) scale(0.96);
            opacity: 0;
        }

        to {
            transform: translate(-50%, 0) scale(1);
            opacity: 1;
        }
    }

    @keyframes gma-pop-slide-out {
        from {
            transform: translate(-50%, 0) scale(1);
            opacity: 1;
        }

        to {
            transform: translate(-50%, -0.5rem) scale(0.98);
            opacity: 0;
        }
    }

    @keyframes gma-game-enter {
        from {
            opacity: 0;
            transform: translateY(0.5rem) scale(0.985);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .modal-content.guess-mode #guessAgeContainer {
        animation: gma-game-enter var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease) backwards;
    }

    .modal-content.guess-mode.gma-fast #guessAgeContainer {
        animation-duration: var(--lwc-duration-fast, 140ms);
    }

    /* when guessing, hide all modal-content children except the athlete-profile */
    .modal-content.guess-mode > :not(.athlete-profile) {
        display: none;
    }

    #detailsModal .modal-content.guess-mode > #closeAthleteDetailsModal,
    #detailsModal .modal-content.guess-mode > .modal-sticky-header {
        display: none !important;
    }

    /* during guess mode, hide everything under athlete-profile except pic, name & slider */
    /* .portrait-wrapper contains #modalProfilePic; keep it visible so the picture shows */
    .modal-content.guess-mode .athlete-profile > *:not(#modalProfilePic):not(#guessAgeContainer):not(.portrait-wrapper) {
        display: none;
    }

    #detailsModal .modal-content.guess-mode {
        overflow-x: hidden;
        overflow-y: auto;
    }

    #detailsModal .modal-content.guess-mode #athlete-profile {
        --gma-portrait-gap: clamp(1.25rem, 2.5vh, 2rem);
        --gma-portrait-size: clamp(220px, min(52vw, 34vh), 360px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0;
        height: 100%;
        min-height: 0;
        box-sizing: border-box;
        padding-block: clamp(2rem, 3vh, 3rem) clamp(0.75rem, 2vh, 1.5rem);
    }

    #detailsModal .modal-content.guess-mode #athlete-profile .portrait-wrapper {
        width: var(--gma-portrait-size);
        height: auto;
        aspect-ratio: 1 / 1;
        max-width: none;
        max-height: none;
        flex: 0 0 auto;
        margin: 0 0 var(--gma-portrait-gap);
    }

    /* The game is one task surface, not a stack of decorative cards. */
    .gma-card {
        width: min(420px, 90%);
        margin-inline: auto;
        background: var(--card-bg);
        border-radius: 12px;
        padding: 2rem 2.25rem 2.5rem;
        text-align: center;
    }

    .gma-avatar {
        margin: 0 0 1.25rem;
        display: inline-block;
        aspect-ratio: 1;
        width: 144px;
        border-radius: 50%;
        overflow: hidden;
        background: var(--card-bg);
        box-shadow: none;
    }

        .gma-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    /* apply the same headline styles to both */
    .gma-heading,
    .chrono-age-heading {
        font-size: 3rem;
        margin: 0;
        color: var(--dark-text-color);
        font-weight: 700;
    }

    .chrono-age-heading.is-revealing {
        animation: gma-heading-reveal calc(var(--lwc-duration-normal, 220ms) * 2) var(--lwc-ease, ease) both;
    }

    @keyframes gma-heading-reveal {
        from {
            opacity: 0;
            transform: translateY(0.35rem) scale(0.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* make the guess‐container fill the modal’s width */
    #guessAgeContainer {
        width: 100%;
        box-sizing: border-box; /* include any padding in that 100% */
    }

    /* let the slider wrap fill all of that */
    .gma-slider-wrap {
        position: relative;
        width: 90%;
        max-width: none; /* override any upstream caps */
        margin: 0.5rem auto 1rem;
        padding-top: 4.25rem; /* reserve a full row for the value bubble */
        align-self: stretch; /* <-- this forces it to span the full parent width */
    }

    /* slider track */
    #gmaRange {
        width: 100%;
        height: 3rem;
        appearance: none;
        background: linear-gradient( 90deg, var(--primary-color) 0%, var(--primary-color) var(--percent, 50%), #d1d5db var(--percent, 50%), #d1d5db 100% );
        border-radius: 999px;
        outline: none;
    }

        /* WebKit thumb */
        #gmaRange::-webkit-slider-thumb {
            appearance: none;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 4px solid #fff;
            box-shadow: 0 0 0 1px rgba(8, 118, 133, 0.18), var(--lwc-shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.08));
            cursor: pointer;
            transition: transform var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), box-shadow var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
        }

        #gmaRange:not(:disabled):active::-webkit-slider-thumb {
            transform: scale(1.08);
            box-shadow: 0 0 0 5px rgba(8, 118, 133, 0.14);
        }

        /* Firefox track and thumb */
        #gmaRange::-moz-range-track {
            background: linear-gradient( 90deg, var(--primary-color) 0%, var(--primary-color) var(--percent, 50%), #d1d5db var(--percent, 50%), #d1d5db 100% );
            height: .5rem;
            border-radius: 999px;
            border: none;
        }

        #gmaRange::-moz-range-thumb {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 4px solid #fff;
            box-shadow: 0 0 0 1px rgba(8, 118, 133, 0.18), var(--lwc-shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.08));
            transition: transform var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), box-shadow var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
        }

        #gmaRange:not(:disabled):active::-moz-range-thumb {
            transform: scale(1.08);
            box-shadow: 0 0 0 5px rgba(8, 118, 133, 0.14);
        }

    #gmaBubble {
        position: absolute;
        top: 0;
        bottom: auto;
        left: var(--percent, 50%);
        transform: translateX(-50%);
        background: #fff;
        color: var(--primary-color);
        font-size: 2rem;
        font-weight: 700;
        padding: 0.55rem 1.1rem;
        border: 2px solid var(--primary-color);
        border-radius: 8px;
        box-shadow: none;
        pointer-events: none;
        white-space: nowrap;
        z-index: 10002;
    }

    #gmaRealBubble {
        position: absolute;
        top: 0;
        bottom: auto;
        left: var(--percent, 50%);
        transform: translateX(-50%);
        background: #fff;
        color: var(--primary-color);
        font-size: 2rem;
        font-weight: 700;
        padding: 0.55rem 1.1rem;
        border: 2px solid var(--primary-color);
        border-radius: 8px;
        box-shadow: none;
        pointer-events: none;
        white-space: nowrap;
        z-index: 10002;
        opacity: 0;
        transform: translateX(-50%) scale(0.9);
        will-change: left, transform;
    }

    #gmaRealBubble.is-travelling {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }

    #gmaRealBubble.is-settled {
        opacity: 1;
        animation: gma-real-age-settle calc(var(--lwc-duration-normal, 220ms) * 3) var(--lwc-ease, ease) both;
    }

    @keyframes gma-real-age-settle {
        0% { transform: translateX(-50%) scale(0.92); }
        55% { transform: translateX(-50%) scale(1.1); }
        100% { transform: translateX(-50%) scale(1); }
    }

        #gmaRealBubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 20px;
            height: 20px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            background: #fff;
            border-left: 4px solid var(--primary-color);
            border-bottom: 4px solid var(--primary-color);
        }

    #gmaBubble::after {
        content: '';
        position: absolute;
        bottom: -10px;
        width: 20px;
        height: 20px;
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
        background: #fff;
        border-left: 4px solid var(--primary-color);
        border-bottom: 4px solid var(--primary-color);
    }

    /* action buttons */
    .gma-actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
        transition: opacity var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
    }

    .gma-btn {
        padding: 1.2rem 2.4rem;
        font-size: 1.2rem;
        min-width: 140px;
        min-height: 48px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        transition: background var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), color var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
    }

    .gma-btn--primary {
        background: var(--primary-color);
        color: #fff;
    }

        .gma-btn--primary:hover {
            background: var(--primary-color);
            filter: brightness(1.1);
        }

    .gma-btn--ghost {
        background: transparent;
        color: var(--primary-color);
        border: 2px solid var(--primary-color);
        padding: 0.8rem 1.6rem;
        font-size: 1rem;
        min-width: 100px;
        min-height: 44px;
    }

        .gma-btn--ghost:hover {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

    /* small screens - keep it tight */
    @media (max-width: 420px) {
        /* adjust buttons on small screens */
        .gma-actions {
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .gma-btn {
            flex: 1 1 auto;
            min-width: 0;
        }

        .gma-btn--ghost {
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
        }

        .gma-btn--primary {
            font-size: 1.1rem;
            padding: 0.6rem 1.2rem;
        }

        .gma-card {
            padding: 1.5rem 1.25rem;
        }

        .gma-avatar {
            width: 116px;
        }

        /* reduce text size on small screens */
        .gma-heading {
            font-size: 2rem;
        }

        .chrono-age-heading {
            font-size: 2rem;
        }

        #gmaBubble,
        #gmaRealBubble {
            font-size: 1.65rem;
            padding: 0.4rem 0.8rem;
        }

        .gma-slider-wrap {
            margin: 0.25rem auto 0.75rem;
            padding-top: 3.75rem;
        }

        /* Keep result feedback readable without covering the task. */
        .gma-pop-banner {
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            gap: 0.25rem;
        }
    }

    /* fade-out and remove when done */
    .gma-card.gma-done {
        opacity: 0;
        height: 0;
        padding: 0; /* collapse the padding too */
        overflow: hidden;
        transition: opacity var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), height var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), padding var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease);
        pointer-events: none;
    }

    .modal-content.gma-fast .gma-card.gma-done {
        /* collapse WAY faster on repeat visits */
        transition: opacity var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), height var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), padding var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease) !important;
    }

    .gma-troll-note {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        align-items: center;
        gap: 0.75rem;
        width: min(100%, 32rem);
        margin: 0 auto 1rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--athlete-modal-cream-border, var(--lwc-border, rgba(255, 255, 255, 0.24)));
        border-inline-start: 4px solid var(--lwc-accent-bright, #19c3d1);
        border-radius: var(--lwc-radius-md, 8px);
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        text-align: left;
    }

    .gma-troll-note[hidden] {
        display: none;
    }

    .gma-troll-note img {
        display: block;
        width: 48px;
        height: 48px;
        object-fit: contain;
    }

    .gma-troll-note p {
        margin: 0;
        line-height: 1.4;
    }

    .gma-troll-note a {
        color: inherit;
        font-weight: 700;
        text-decoration-thickness: 0.1em;
        text-underline-offset: 0.14em;
    }

    .gma-heading,
    .chrono-age-heading {
        white-space: normal;
        display: block;
        max-width: 100%;
        box-sizing: border-box;
        line-height: 1.08;
        text-align: center;
    }

    @keyframes fadeOutButtons {
        from {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        to {
            opacity: 0;
            visibility: hidden;
            transform: translateY(0.2rem);
        }
    }

    .gma-actions.gma-actions-hide {
        visibility: hidden;
        opacity: 0 !important;
        animation: fadeOutButtons var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease) both !important;
        pointer-events: none; /* ← prevent any mouse events */
    }

    /* The result sentence preserves the submitted value; hide its bubble so nearby ages cannot collide. */
    #gmaBubble.gma-bubble-inactive {
        opacity: 0;
        transform: translateX(-50%) scale(0.86);
    }

    /* Smooth transitions on track, thumb & bubbles */
    #gmaRange,
    #gmaBubble,
    #gmaRealBubble {
        transition: background var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), border-color var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), color var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), opacity var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), transform var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease);
    }

    .gma-reaction {
        position: fixed;
        left: var(--gma-reaction-x, 50%);
        top: var(--gma-reaction-y, 35%);
        z-index: 10003;
        pointer-events: none;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-size: clamp(4.5rem, 12vw, 8rem);
        line-height: 1;
        filter: drop-shadow(0 0.5rem 1rem rgba(15, 23, 42, 0.24));
        animation: gma-reaction-pop calc(var(--lwc-duration-normal, 220ms) * 4) var(--lwc-ease, ease) both;
    }

    @keyframes gma-reaction-pop {
        0% {
            opacity: 0;
            transform: translate(-50%, -42%) scale(0.45) rotate(-8deg);
        }
        42% {
            opacity: 1;
            transform: translate(-50%, -58%) scale(1.12) rotate(4deg);
        }
        72% {
            opacity: 1;
            transform: translate(-50%, -55%) scale(0.98) rotate(0);
        }
        100% {
            opacity: 0;
            transform: translate(-50%, -70%) scale(1.02) rotate(0);
        }
    }

    .gma-celebration-spark {
        position: fixed;
        left: var(--gma-spark-x, 50%);
        top: var(--gma-spark-y, 50%);
        z-index: 10001;
        width: 1.75rem;
        height: 1.75rem;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--lwc-surface, #fff);
        color: var(--gma-spark-color, var(--lwc-accent, #087685));
        box-shadow: var(--lwc-shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.12));
        pointer-events: none;
        opacity: 0;
        animation: gma-spark-flight calc(var(--lwc-duration-normal, 220ms) * 5) var(--lwc-ease, ease) both;
    }

    @keyframes gma-spark-flight {
        0% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.35) rotate(0);
        }
        18% {
            opacity: 1;
        }
        68% {
            opacity: 1;
        }
        100% {
            opacity: 0;
            transform: translate(calc(-50% + var(--gma-spark-dx, 0px)), calc(-50% + var(--gma-spark-dy, -8rem))) scale(0.9) rotate(var(--gma-spark-rotation, 120deg));
        }
    }

    @keyframes gma-card-celebrate {
        0%, 100% {
            transform: scale(1);
            box-shadow: none;
        }
        45% {
            transform: scale(1.012);
            box-shadow: 0 0 0 4px rgba(25, 195, 209, 0.18), var(--lwc-shadow-md, 0 10px 28px rgba(15, 23, 42, 0.16));
        }
    }

    .modal-content.guess-mode #guessAgeContainer.celebrate-better,
    .modal-content.guess-mode #guessAgeContainer.celebrate-exact {
        animation: gma-card-celebrate calc(var(--lwc-duration-normal, 220ms) * 4) var(--lwc-ease, ease) both;
    }

    .gma-card.celebrate-better {
        border-color: var(--lwc-accent-bright, #19c3d1) !important;
    }

    /* Exact guesses receive a single restrained gold state. */
    .gma-card.celebrate-exact #gmaRange {
        background: #ead58b !important;
        box-shadow: none;
    }

        /* GOLDEN THUMB for WebKit */
        .gma-card.celebrate-exact #gmaRange::-webkit-slider-thumb {
            background: #9a6700 !important;
        }

        /* GOLDEN THUMB for Firefox */
        .gma-card.celebrate-exact #gmaRange::-moz-range-thumb {
            background: #9a6700 !important;
        }

    /* GOLDEN BUBBLES */
    .gma-card.celebrate-exact #gmaBubble,
    .gma-card.celebrate-exact #gmaRealBubble {
        background: #fff4bf !important;
        border-color: #9a6700 !important;
        color: #5f4500 !important;
        box-shadow: none;
    }

    #detailsModal .gma-card {
        width: min(680px, calc(100% - 2rem));
        margin-top: 0;
        margin-bottom: 0;
        box-sizing: border-box;
        background: rgba(255,255,255,.06);
        color: var(--athlete-modal-text, rgba(255,255,255,.94));
        border: 1px solid var(--athlete-modal-cream-border, rgba(246,244,237,.52));
        box-shadow: none;
        padding: 1.4rem 2rem 1.65rem;
    }
    #detailsModal .gma-avatar {
        background: rgba(255,255,255,.08);
        box-shadow: none;
    }
    #detailsModal .gma-heading,
    #detailsModal .chrono-age-heading {
        color: var(--athlete-modal-text, rgba(255,255,255,.94));
        font-size: clamp(2rem, 4vw, 2.5rem);
        margin-bottom: 0.25rem;
        text-shadow: none;
    }
    #detailsModal #gmaStatus {
        color: var(--athlete-modal-cream, rgba(246,244,237,.92));
        line-height: 1.35;
        margin: 0.25rem auto 1rem;
        max-width: 34rem;
    }
    #detailsModal #gmaRange {
        background: linear-gradient(90deg, rgba(246,244,237,.88) 0%, rgba(246,244,237,.88) var(--percent, 50%), rgba(255,255,255,.24) var(--percent, 50%), rgba(255,255,255,.24) 100%);
    }
    #detailsModal #gmaRange::-moz-range-track {
        background: linear-gradient(90deg, rgba(246,244,237,.88) 0%, rgba(246,244,237,.88) var(--percent, 50%), rgba(255,255,255,.24) var(--percent, 50%), rgba(255,255,255,.24) 100%);
    }
    #detailsModal #gmaRange::-webkit-slider-thumb {
        background: rgba(246,244,237,.98);
        border-color: rgba(255,255,255,.95);
        box-shadow: none;
    }
    #detailsModal #gmaRange::-moz-range-thumb {
        background: rgba(246,244,237,.98);
        border-color: rgba(255,255,255,.95);
        box-shadow: none;
    }
    #detailsModal #gmaBubble,
    #detailsModal #gmaRealBubble {
        background: rgba(10,12,12,.96);
        color: var(--athlete-modal-cream, rgba(246,244,237,.92));
        border-color: var(--athlete-modal-cream-border, rgba(246,244,237,.52));
        box-shadow: none;
    }
    #detailsModal #gmaBubble::after,
    #detailsModal #gmaRealBubble::after {
        background: rgba(10,12,12,.96);
        border-left-color: var(--athlete-modal-cream-border, rgba(246,244,237,.52));
        border-bottom-color: var(--athlete-modal-cream-border, rgba(246,244,237,.52));
    }
    #detailsModal .gma-btn {
        box-shadow: none;
    }
    #detailsModal .gma-btn:focus-visible {
        outline: none;

<div id="guessAgeContainer" class="gma-card">
    <h3 class="gma-heading">Guess my age!</h3>
    <h3 class="chrono-age-heading" style="display: none;">My real age is:</h3>

    <div id="gmaTrollNote" class="gma-troll-note" role="status" aria-atomic="true" hidden>
        <img src="{{ASSET_TROLLFACE}}" alt="" width="48" height="48" loading="lazy" decoding="async" />
        <p>Nice try. Pick another age, or <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">claim your rickroll</a>.</p>
    </div>

    <div class="gma-slider-wrap">
        <input type="range"
               min="1"
               max="130"
               value="33"
               id="gmaRange"
               aria-label="Guess athlete’s age — 1 to 130 years" />

        <output for="gmaRange" id="gmaBubble">33</output>
    </div>

    <div class="gma-actions">
        <button id="gmaSkipAll" class="gma-btn gma-btn--ghost" style="display: none;" title="The Guess my age game will no longer appear for any athlete">Skip all</button>
        <button class="gma-btn gma-btn--ghost">Skip</button>
        <button class="gma-btn gma-btn--primary">Submit</button>
    </div>
</div>

<script>
    /* === Guess-My-Age bindings for the new widget === */
    const gmaRange = document.getElementById('gmaRange');
    const gmaDefaultValue = gmaRange.value;

    const gmaBubble = document.getElementById('gmaBubble');
    const gmaCard = document.querySelector('.gma-card');

    const heading = gmaCard.querySelector('.gma-heading');
    const chronoHeading = gmaCard.querySelector('.chrono-age-heading');
    const gmaStatus = document.getElementById('gmaStatus');
    const gmaTrollNote = document.getElementById('gmaTrollNote');

    const modalContent = document.querySelector('#detailsModal .modal-content');
    const gmaActions = gmaCard.querySelector('.gma-actions');
    let gmaWasGuessMode = modalContent.classList.contains('guess-mode');
    let gmaObservedAthleteSlug = modalContent.dataset.athleteSlug || '';
    let gmaPresentationGeneration = 0;
    let cancelCurrentGmaReveal = null;
    let gmaExitTimer = 0;

    function cancelGmaPresentation() {
        gmaPresentationGeneration += 1;

        const cancelReveal = cancelCurrentGmaReveal;
        cancelCurrentGmaReveal = null;
        if (cancelReveal) cancelReveal();

        if (gmaExitTimer) {
            window.clearTimeout(gmaExitTimer);
            gmaExitTimer = 0;
        }
    }

    function beginGmaPresentation(athleteSlug) {
        cancelGmaPresentation();
        return {
            athleteSlug,
            generation: gmaPresentationGeneration
        };
    }

    function isCurrentGmaPresentation(presentation) {
        return presentation.generation === gmaPresentationGeneration
            && modalContent.classList.contains('guess-mode')
            && modalContent.dataset.athleteSlug === presentation.athleteSlug;
    }

    // whenever the modal’s class list changes, if we just opened “guess-mode”,
    // remove any lingering hide classes so buttons reappear
    const resetObserver = new MutationObserver(mutations => {
        const isGuessMode = modalContent.classList.contains('guess-mode');
        const athleteSlug = modalContent.dataset.athleteSlug || '';
        const guessModeWasAbsentDuringBatch = mutations.some(mutation =>
            mutation.attributeName === 'class'
            && !String(mutation.oldValue || '').split(/\s+/).includes('guess-mode'));
        const openedOrChangedAthlete = isGuessMode
            && (!gmaWasGuessMode
                || athleteSlug !== gmaObservedAthleteSlug
                || guessModeWasAbsentDuringBatch);

        if (openedOrChangedAthlete) {
            cancelGmaPresentation();
            setGuessMyAgeParam(true);
            // hide the chrono prompt again
            chronoHeading.style.display = 'none';
            // restore the original prompt
            heading.style.display = '';
            chronoHeading.classList.remove('is-revealing');
            gmaStatus.hidden = true;
            gmaStatus.textContent = '';
            gmaTrollNote.hidden = true;
            gmaCard.removeAttribute('aria-busy');
            gmaActions.classList.remove('gma-actions-hide');
            gmaActions.inert = false;
            gmaCard.classList.remove('gma-done');

            gmaBubble.classList.remove('gma-bubble-inactive');

            const oldRealBubble = document.getElementById('gmaRealBubble');
            if (oldRealBubble) oldRealBubble.remove();

            gmaRange.value = gmaDefaultValue;
            gmaRange.disabled = false;
            gmaRange.style.pointerEvents = '';
            gmaSubmitBtn.disabled = false;
            syncRange();
            gmaRange.focus({ preventScroll: true });

            gmaCard.classList.remove('celebrate-exact', 'celebrate-better');
            clearGmaEphemera();
        } else if (!isGuessMode && gmaWasGuessMode) {
            cancelGmaPresentation();
            setGuessMyAgeParam(false);
        }

        gmaWasGuessMode = isGuessMode;
        gmaObservedAthleteSlug = athleteSlug;
    });

    resetObserver.observe(modalContent, { attributes: true, attributeOldValue: true });

    function syncRange() {
        const val = +gmaRange.value;
        const pct = (val / gmaRange.max) * 100;
        gmaRange.style.setProperty('--percent', `${pct}%`);
        gmaBubble.textContent = val;
        const clampedPct = Math.min(Math.max(pct, 5), 95);
        gmaBubble.style.left = `${clampedPct}%`;
    }
    gmaRange.addEventListener('input', syncRange);
    syncRange();   // initialise bubble

    function prefersReducedGmaMotion() {
        return typeof window.matchMedia === 'function'
            && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function clampGmaAge(age) {
        return Math.min(Math.max(age, +gmaRange.min), +gmaRange.max);
    }

    function gmaPercentForAge(age) {
        return Math.min(Math.max((age / +gmaRange.max) * 100, 5), 95);
    }

    function positionGmaRevealBubble(realBubble, age) {
        const displayedAge = Math.round(clampGmaAge(age));
        const percent = gmaPercentForAge(displayedAge);
        realBubble.textContent = displayedAge;
        realBubble.style.left = `${percent}%`;
        gmaRange.value = displayedAge;
        gmaRange.style.setProperty('--percent', `${percent}%`);
    }

    function animateActualAgeReveal(realBubble, startAge, actualAge, presentation) {
        if (!isCurrentGmaPresentation(presentation)) return Promise.resolve(false);

        positionGmaRevealBubble(realBubble, startAge);
        realBubble.classList.add('is-travelling');

        if (prefersReducedGmaMotion() || startAge === actualAge) {
            positionGmaRevealBubble(realBubble, actualAge);
            realBubble.classList.remove('is-travelling');
            realBubble.classList.add('is-settled');
            return Promise.resolve(true);
        }

        const distance = Math.abs(actualAge - startAge);
        const directionToActual = Math.sign(actualAge - startAge);
        const anticipationDistance = Math.min(6, Math.max(2, distance * 0.22));
        const anticipationAge = clampGmaAge(startAge - (directionToActual * anticipationDistance));
        const duration = Math.min(1400, 720 + (distance * 16));

        return new Promise(resolve => {
            let startedAt = 0;
            let revealFrameId = 0;
            let revealFallbackTimer = 0;
            let isFinished = false;
            const easeOutCubic = value => 1 - Math.pow(1 - value, 3);
            const easeInOutCubic = value => value < 0.5
                ? 4 * value * value * value
                : 1 - (Math.pow(-2 * value + 2, 3) / 2);

            function finishReveal(shouldSettle) {
                if (isFinished) return;
                isFinished = true;
                if (revealFrameId) window.cancelAnimationFrame(revealFrameId);
                if (revealFallbackTimer) window.clearTimeout(revealFallbackTimer);
                if (cancelCurrentGmaReveal === cancelReveal) cancelCurrentGmaReveal = null;

                const canSettle = shouldSettle && isCurrentGmaPresentation(presentation);
                if (canSettle) {
                    positionGmaRevealBubble(realBubble, actualAge);
                    realBubble.classList.remove('is-travelling');
                    realBubble.classList.add('is-settled');
                }
                resolve(canSettle);
            }

            function cancelReveal() {
                finishReveal(false);
            }

            function revealFrame(timestamp) {
                if (!isCurrentGmaPresentation(presentation)) {
                    finishReveal(false);
                    return;
                }
                if (prefersReducedGmaMotion()) {
                    finishReveal(true);
                    return;
                }

                if (!startedAt) startedAt = timestamp;
                const progress = Math.min((timestamp - startedAt) / duration, 1);
                let age;

                if (progress < 0.22) {
                    const anticipationProgress = easeOutCubic(progress / 0.22);
                    age = startAge + ((anticipationAge - startAge) * anticipationProgress);
                } else {
                    const revealProgress = easeInOutCubic((progress - 0.22) / 0.78);
                    age = anticipationAge + ((actualAge - anticipationAge) * revealProgress);
                }

                positionGmaRevealBubble(realBubble, age);
                if (progress < 1) {
                    revealFrameId = window.requestAnimationFrame(revealFrame);
                    return;
                }

                finishReveal(true);
            }

            cancelCurrentGmaReveal = cancelReveal;
            revealFallbackTimer = window.setTimeout(() => finishReveal(true), duration + 240);
            revealFrameId = window.requestAnimationFrame(revealFrame);
        });
    }

    function showGmaReaction(reaction) {
        if (prefersReducedGmaMotion()) return;
        const portrait = document.getElementById('modalProfilePic');
        if (!portrait) return;

        const rect = portrait.getBoundingClientRect();
        const reactionElement = document.createElement('div');
        reactionElement.className = 'gma-reaction';
        reactionElement.setAttribute('aria-hidden', 'true');
        reactionElement.textContent = reaction === 'exact' ? '🎯' : reaction === 'younger' ? '🙌' : '😬';
        reactionElement.style.setProperty('--gma-reaction-x', `${rect.left + (rect.width / 2)}px`);
        reactionElement.style.setProperty('--gma-reaction-y', `${rect.top + (rect.height / 2)}px`);
        document.body.appendChild(reactionElement);
        reactionElement.addEventListener('animationend', () => reactionElement.remove(), { once: true });
        window.setTimeout(() => reactionElement.remove(), 1600);
    }

    function spawnGmaCelebration(isExact) {
        if (prefersReducedGmaMotion()) return;

        const rect = gmaCard.getBoundingClientRect();
        const centerX = rect.left + (rect.width / 2);
        const centerY = rect.top + Math.min(rect.height * 0.55, 220);
        const icons = ['clock', 'stopwatch', 'hourglass-half', 'calendar-check'];
        const sparkCount = isExact ? 14 : 9;

        for (let index = 0; index < sparkCount; index++) {
            const angle = ((Math.PI * 2) / sparkCount) * index - (Math.PI / 2);
            const distance = 88 + ((index % 3) * 24);
            const spark = document.createElement('i');
            spark.className = `gma-celebration-spark fas fa-${icons[index % icons.length]}`;
            spark.setAttribute('aria-hidden', 'true');
            spark.style.setProperty('--gma-spark-x', `${centerX}px`);
            spark.style.setProperty('--gma-spark-y', `${centerY}px`);
            spark.style.setProperty('--gma-spark-dx', `${Math.cos(angle) * distance}px`);
            spark.style.setProperty('--gma-spark-dy', `${Math.sin(angle) * distance}px`);
            spark.style.setProperty('--gma-spark-rotation', `${index % 2 === 0 ? 140 : -140}deg`);
            spark.style.animationDelay = `${index * 32}ms`;
            if (isExact) spark.style.setProperty('--gma-spark-color', 'var(--lwc-warning, #9a6700)');
            document.body.appendChild(spark);
            spark.addEventListener('animationend', () => spark.remove(), { once: true });
            window.setTimeout(() => spark.remove(), 2200);
        }
    }

    function clearGmaEphemera() {
        document.querySelectorAll('.gma-reaction, .gma-celebration-spark, .gma-pop-banner')
            .forEach(element => element.remove());
    }

    function persistGmaGuessState(athleteSlug, guessState) {
        try {
            if (window.LwcGuessState) {
                window.LwcGuessState.set(athleteSlug, guessState);
                return true;
            }

            const allGuesses = JSON.parse(localStorage.getItem('gmaAllGuesses') || '{}');
            allGuesses[athleteSlug] = guessState;
            localStorage.setItem('gmaAllGuesses', JSON.stringify(allGuesses));
            return true;
        } catch (error) {
            console.warn('Could not persist Guess My Age state.', error);
            return false;
        }
    }

    function scheduleGmaExit(athleteSlug, presentationGeneration, dwell) {
        if (gmaExitTimer) window.clearTimeout(gmaExitTimer);

        const canExit = () => modalContent.classList.contains('guess-mode')
            && modalContent.dataset.athleteSlug === athleteSlug
            && (presentationGeneration == null || presentationGeneration === gmaPresentationGeneration);

        const beginExit = () => {
            gmaExitTimer = 0;
            if (!canExit()) return;

            gmaCard.classList.add('gma-done');
            const exitDelay = prefersReducedGmaMotion()
                ? 0
                : modalContent.classList.contains('gma-fast')
                    ? 140
                    : 220;
            gmaExitTimer = window.setTimeout(() => {
                gmaExitTimer = 0;
                if (!canExit()) return;

                modalContent.classList.remove('guess-mode');
                modalContent.scrollTop = 0;
                modalContent.scrollLeft = 0;
                document.getElementById('closeAthleteDetailsModal')?.focus({ preventScroll: true });
            }, exitDelay);
        };

        if (dwell > 0) {
            gmaExitTimer = window.setTimeout(beginExit, dwell);
        } else {
            beginExit();
        }
    }

    function restoreGuessControls(message, focusTarget) {
        gmaCard.removeAttribute('aria-busy');
        gmaStatus.hidden = !message;
        gmaStatus.textContent = message || '';
        gmaActions.classList.remove('gma-actions-hide');
        gmaActions.inert = false;
        gmaRange.disabled = false;
        gmaRange.style.pointerEvents = '';
        gmaSubmitBtn.disabled = false;
        (focusTarget || gmaRange).focus();
    }

    const gmaSubmitBtn = gmaCard.querySelector('.gma-btn--primary');
    gmaSubmitBtn.addEventListener('click', async function () {
        const userGuess = +gmaRange.value;

        if (userGuess === +gmaRange.min || userGuess === +gmaRange.max) {
            gmaTrollNote.hidden = false;
            restoreGuessControls('', gmaRange);
            return;
        }

        gmaTrollNote.hidden = true;
        const presentation = beginGmaPresentation(modalContent.dataset.athleteSlug);

        gmaCard.setAttribute('aria-busy', 'true');
        gmaStatus.hidden = false;
        gmaStatus.textContent = 'Submitting your guess…';
        gmaStatus.focus({ preventScroll: true });
        gmaActions.classList.add('gma-actions-hide');
        gmaActions.inert = true;
        gmaRange.disabled = true;
        gmaRange.style.pointerEvents = 'none';
        gmaSubmitBtn.disabled = true;

        try {
            const response = await fetch(
                `/api/Guess/athlete-age?athleteName=${encodeURIComponent(presentation.athleteSlug)}&ageGuess=${userGuess}`,
                { method: 'POST' }
            );

            if (!response.ok) {
                throw new Error(`Guess submission failed with status ${response.status}`);
            }

            const result = await response.json();
            const realAge = +result.actualAge;
            if (!Number.isFinite(realAge)) {
                throw new Error('Guess response did not include a valid actual age');
            }

            // GuessAccepted describes inclusion in the public Crowd Age aggregate, not whether
            // the player completed the game. Always reveal a successful response: asking the
            // player to revise after the server has disclosed the real age creates a dead end
            // and would let a filtered guess be replaced with a knowingly correct one.
            const crowdCountBeforeGuess = result.crowdCount === 1 ? 0 : result.crowdCount;
            const isFirstGuess = result.guessAccepted === true && crowdCountBeforeGuess === 0;
            const userError = Math.abs(realAge - userGuess);
            const crowdError = result.crowdAge === 0 || isFirstGuess
                ? null
                : Math.abs(realAge - result.crowdAge);
            const guessState = {
                value: userGuess,
                skipped: false,
                first: isFirstGuess,
                exact: userError === 0
            };

            // The accepted result is durable before any presentation work. A reload, tab switch,
            // or newly opened athlete must never lose or misattribute this completed round.
            persistGmaGuessState(presentation.athleteSlug, guessState);
            if (userError === 0
                && window.proDiscounts
                && typeof window.proDiscounts.setPerfectGuessMarker === 'function') {
                window.proDiscounts.setPerfectGuessMarker();
            }

            if (!isCurrentGmaPresentation(presentation)) return;
            updateYourGuess();

            updateCrowdContainer(result.crowdAge, result.crowdCount);
            heading.style.display = 'none';
            chronoHeading.style.display = 'block';
            chronoHeading.classList.remove('is-revealing');
            void chronoHeading.offsetWidth;
            chronoHeading.classList.add('is-revealing');
            const reactionKind = userGuess === realAge
                ? 'exact'
                : userGuess < realAge
                    ? 'younger'
                    : 'older';
            const reactionCopy = reactionKind === 'exact'
                ? 'Right on the nose.'
                : reactionKind === 'younger'
                    ? 'You guessed younger — high five.'
                    : 'You guessed older — oof.';
            gmaStatus.textContent = `Actual age: ${realAge}. Your guess: ${userGuess}. ${reactionCopy}`;
            gmaCard.removeAttribute('aria-busy');
            gmaStatus.focus({ preventScroll: true });

            const sliderWrap = document.querySelector('.gma-slider-wrap');
            const realBubble = document.createElement('span');
            realBubble.id = 'gmaRealBubble';
            realBubble.className = 'gma-real-bubble';
            realBubble.setAttribute('aria-hidden', 'true');
            sliderWrap.appendChild(realBubble);

            gmaBubble.classList.add('gma-bubble-inactive');
            const revealCompleted = await animateActualAgeReveal(
                realBubble,
                userGuess,
                realAge,
                presentation);
            if (!revealCompleted || !isCurrentGmaPresentation(presentation)) return;

            showGmaReaction(reactionKind);

            if (userError === 0) {
                gmaCard.classList.add('celebrate-exact');
                popBanner(true, false);
                spawnGmaCelebration(true);
            } else if (isFirstGuess) {
                popBanner(false, true);
            } else if (crowdError !== null && userError < crowdError) {
                gmaCard.classList.add('celebrate-better');
                popBanner(false, false);
                spawnGmaCelebration(false);
            }

            scheduleGmaExit(
                presentation.athleteSlug,
                presentation.generation,
                prefersReducedGmaMotion() ? 1600 : 3000);
        } catch (error) {
            if (!isCurrentGmaPresentation(presentation)) return;
            console.error('Error submitting guess:', error);
            restoreGuessControls('We could not submit your guess. Please try again.', gmaSubmitBtn);
        }
    });

    // bind hideCard to _all_ ghost buttons (Skip & Skip All)
    gmaCard.querySelectorAll('.gma-btn--ghost')
        .forEach(btn => btn.addEventListener('click', hideCard));
    function hideCard(e) {
        // if they clicked “Skip All”, set global flag
        const isSkipAll = e.currentTarget.id === 'gmaSkipAll';
        if (isSkipAll) {
            try {
                localStorage.setItem('gmaSkipAll', 'true');
            } catch (error) {
                console.warn('Could not persist the Guess My Age skip-all preference.', error);
            }
        }

        const modalContent = document.querySelector('#detailsModal .modal-content');
        const athleteSlug = modalContent.dataset.athleteSlug;
        cancelGmaPresentation();
        persistGmaGuessState(athleteSlug, {
            value: null,
            skipped: true,
            first: false,
            exact: false
        });
        updateYourGuess();
        scheduleGmaExit(athleteSlug, null, 0);
    }

    function popBanner(isExact, isFirst) {
        const b = document.createElement('div');
        b.setAttribute('role', 'status');
        b.setAttribute('aria-live', 'polite');
        b.classList.add('gma-pop-banner');
        if (isExact) {
            b.classList.add('gma-pop-banner--golden');
        }

        const icon = document.createElement('span');
        icon.className = 'gma-pop-banner__icon';
        icon.setAttribute('aria-hidden', 'true');
        const iconGlyph = document.createElement('i');
        iconGlyph.className = isExact
            ? 'fas fa-bullseye'
            : isFirst
                ? 'fas fa-medal'
                : 'fas fa-people-group';
        icon.appendChild(iconGlyph);

        const copy = document.createTextNode(isExact
            ? 'Bullseye!'
            : isFirst
                ? 'First accepted guess!'
                : 'You beat the crowd!');
        b.append(icon, copy);

        document.body.appendChild(b);
        requestAnimationFrame(() => b.classList.add('show'));

        const bannerDwell = prefersReducedGmaMotion() ? 1200 : 2800;
        setTimeout(() => {
            b.classList.add('hide');
            b.addEventListener('animationend', () => b.remove());
            setTimeout(() => b.remove(), 350);
        }, bannerDwell);

    }

    function setGuessMyAgeParam(active) {
        const url = new URL(window.location.href);
        if (active) url.searchParams.set('guessmyage', '1');
        else url.searchParams.delete('guessmyage');
        history.replaceState(history.state || {}, "", url.toString());
    }
</script>
