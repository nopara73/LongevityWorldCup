<style>
    /* The payoff lives inside the game card so it can never cover the athlete. */
    .gma-pop-banner {
        position: relative;
        transform: translateY(-0.65rem) scale(0.72);
        width: max-content;
        max-width: 100%;
        min-height: 56px;
        padding: 0.85rem 1.4rem;
        background: var(--lwc-accent, var(--primary-color));
        color: var(--lwc-on-accent, #fff);
        font-size: clamp(1.25rem, 3.4vw, 2rem);
        font-weight: 700;
        line-height: 1.15;
        text-align: center;
        border: 1px solid rgba(255,255,255,.32);
        border-radius: 1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,.25);
        box-shadow: 0 1rem 2.5rem rgba(2, 8, 23, 0.34), 0 0 0 1px rgba(255,255,255,.2) inset;
    }

    .gma-pop-banner.show {
        animation: gma-pop-slide-in calc(var(--lwc-duration-normal, 220ms) * 3) var(--lwc-ease, ease) forwards;
    }

    .gma-pop-banner.hide {
        animation: gma-pop-slide-out calc(var(--lwc-duration-normal, 220ms) * 2) var(--lwc-ease, ease) forwards;
    }

    .gma-pop-banner.gma-pop-banner--golden {
        background: linear-gradient(135deg, #fff3a1 0%, #d6a315 48%, #fff1a0 72%, #9a6700 100%) !important;
        border-color: rgba(95, 69, 0, 0.34);
        color: #4f3900 !important;
        box-shadow: 0 1.25rem 3rem rgba(63, 44, 0, 0.42), 0 0 1.8rem rgba(255, 215, 0, 0.5);
    }

    @keyframes gma-pop-slide-in {
        0% {
            transform: translateY(-0.65rem) scale(0.72) rotate(-2deg);
            opacity: 0;
        }

        58% {
            transform: translateY(0.15rem) scale(1.1) rotate(1deg);
            opacity: 1;
        }

        76% {
            transform: translateY(0) scale(0.97) rotate(-0.6deg);
            opacity: 1;
        }

        100% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
    }

    @keyframes gma-pop-slide-out {
        from {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        to {
            transform: translateY(-0.6rem) scale(0.88);
            opacity: 0;
        }
    }

    @keyframes gma-game-enter {
        from { opacity: 0.72; transform: translateY(0.65rem) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes gma-portrait-enter {
        from { opacity: 0.45; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes gma-prompt-enter {
        0% { opacity: 0; transform: translateY(0.55rem) scale(0.72); }
        68% { opacity: 1; transform: translateY(-0.08rem) scale(1.075); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes gma-prompt-type {
        from { width: 0; }
        to { width: min(var(--gma-type-width, 17ch), 100%); }
    }

    @keyframes gma-control-enter {
        from { opacity: var(--gma-control-start-opacity, 0); transform: translateY(0.8rem) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes gma-control-fade {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @media (prefers-reduced-motion: no-preference) and (min-width: 769px) {
        .modal-content.guess-mode:not(.gma-fast) {
            --gma-entry-duration: calc(var(--lwc-duration-normal, 220ms) * 9);
            --gma-control-duration: calc(var(--lwc-duration-fast, 140ms) * 2.5);
            --gma-controls-delay: calc(var(--lwc-duration-fast, 140ms) * 6);
        }

        .modal-content.guess-mode:not(.gma-fast) #guessAgeContainer {
            animation: gma-game-enter calc(var(--lwc-duration-normal, 220ms) * 2) var(--lwc-ease, ease) backwards;
        }

        .modal-content.guess-mode:not(.gma-fast) #athlete-profile .portrait-wrapper {
            animation: gma-portrait-enter calc(var(--lwc-duration-normal, 220ms) * 3) var(--lwc-ease, ease) both;
        }

        .modal-content.guess-mode:not(.gma-fast) #guessAgeContainer .gma-heading,
        .modal-content.guess-mode:not(.gma-fast) #guessAgeContainer .chrono-age-heading.is-revealing {
            animation: gma-prompt-type var(--gma-entry-duration) var(--lwc-ease, ease) both;
            animation-timing-function: steps(15, end);
        }

        .modal-content.guess-mode:not(.gma-fast) #guessAgeContainer .gma-slider-wrap,
        .modal-content.guess-mode:not(.gma-fast) #guessAgeContainer .gma-actions {
            --gma-control-start-opacity: 0;
            animation: gma-control-fade var(--gma-control-duration) var(--lwc-ease, ease) var(--gma-controls-delay) both;
        }
    }

    @media (prefers-reduced-motion: no-preference) {
        .modal-content.guess-mode.gma-fast {
            --gma-entry-duration: var(--lwc-duration-normal, 220ms);
            --gma-slider-delay: var(--lwc-duration-fast, 140ms);
            --gma-actions-delay: calc(var(--lwc-duration-fast, 140ms) * 2);
        }

        .modal-content.guess-mode.gma-fast #guessAgeContainer {
            animation: gma-game-enter var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease) backwards;
        }

        .modal-content.guess-mode.gma-fast #athlete-profile .portrait-wrapper,
        .modal-content.guess-mode.gma-fast #guessAgeContainer .gma-heading {
            animation: gma-prompt-enter var(--gma-entry-duration) var(--lwc-ease, ease) both;
        }

        .modal-content.guess-mode.gma-fast #guessAgeContainer .chrono-age-heading.is-revealing {
            animation: gma-prompt-enter calc(var(--lwc-duration-fast, 140ms) * 2) var(--lwc-ease, ease) both;
        }

        .modal-content.guess-mode.gma-fast #guessAgeContainer .gma-slider-wrap,
        .modal-content.guess-mode.gma-fast #guessAgeContainer .gma-actions {
            animation: gma-control-enter var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease) var(--gma-slider-delay) both;
        }

        .modal-content.guess-mode.gma-fast #guessAgeContainer .gma-actions {
            animation-delay: var(--gma-actions-delay);
        }
    }

    /* when guessing, hide all modal-content children except the athlete-profile */
    .modal-content.guess-mode > :not(.athlete-profile) {
        display: none;
    }

    #detailsModal .modal-content.guess-mode > #closeAthleteDetailsModal,
    #detailsModal .modal-content.guess-mode > .modal-sticky-header {
        display: none !important;
    }

    /* during guess mode, hide everything under athlete-profile except pic, name & slider */
    /* .portrait-wrapper contains #modalProfilePic; keep it visible so the picture shows */
    .modal-content.guess-mode .athlete-profile > *:not(#modalProfilePic):not(#guessAgeContainer):not(.portrait-wrapper) {
        display: none;
    }

    #detailsModal .modal-content.guess-mode {
        overflow-x: hidden;
        overflow-y: auto;
    }

    #detailsModal .modal-content.guess-mode #athlete-profile {
        --gma-portrait-gap: clamp(2rem, 4vh, 3rem);
        --gma-portrait-size: clamp(220px, min(58vw, 40vh), 430px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0;
        height: 100%;
        min-height: 0;
        box-sizing: border-box;
        padding-block: clamp(3rem, 4.5vh, 4rem) clamp(0.75rem, 2vh, 1.5rem);
    }

    #detailsModal .modal-content.guess-mode #athlete-profile .portrait-wrapper {
        width: var(--gma-portrait-size);
        height: auto;
        aspect-ratio: 1 / 1;
        max-width: none;
        max-height: none;
        flex: 0 0 auto;
        margin: 0 0 var(--gma-portrait-gap);
    }

    /* The game card is the active stage, with more depth than the profile below it. */
    .gma-card {
        width: min(420px, 90%);
        margin-inline: auto;
        background: var(--card-bg);
        border-radius: 1.25rem;
        padding: 2rem 2.25rem 2.5rem;
        text-align: center;
    }

    .gma-avatar {
        margin: 0 0 1.25rem;
        display: inline-block;
        aspect-ratio: 1;
        width: 144px;
        border-radius: 50%;
        overflow: hidden;
        background: var(--card-bg);
        box-shadow: none;
    }

        .gma-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    /* apply the same headline styles to both */
    .gma-heading,
    .chrono-age-heading {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        line-height: 1.08;
        font-size: 3rem;
        margin: 0;
        color: var(--dark-text-color);
        font-weight: 700;
    }

    .gma-heading {
        --gma-type-width: 15ch;
    }

    .chrono-age-heading {
        --gma-type-width: 17ch;
    }

    .chrono-age-heading.is-revealing {
        animation: gma-heading-reveal calc(var(--lwc-duration-normal, 220ms) * 3) var(--lwc-ease, ease) both;
    }

    @keyframes gma-heading-reveal {
        0% {
            opacity: 0;
            transform: translateY(0.55rem) scale(0.76);
        }
        68% {
            opacity: 1;
            transform: translateY(-0.08rem) scale(1.06);
        }
        100% {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* make the guess‐container fill the modal’s width */
    #guessAgeContainer {
        width: 100%;
        box-sizing: border-box; /* include any padding in that 100% */
    }

    /* let the slider wrap fill all of that */
    .gma-slider-wrap {
        position: relative;
        width: 90%;
        max-width: none; /* override any upstream caps */
        margin: 1.25rem auto 1.5rem;
        padding-top: 5.25rem; /* reserve a full row for the larger value bubble */
        align-self: stretch; /* <-- this forces it to span the full parent width */
        transition: padding-bottom var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), margin-bottom var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease);
    }

    .gma-card.is-revealing .gma-slider-wrap {
        padding-bottom: 2.85rem;
        margin-bottom: 0.35rem;
    }

    /* slider track */
    #gmaRange {
        --gma-thumb-size: 64px;
        width: 100%;
        height: 3rem;
        appearance: none;
        background: linear-gradient( 90deg, var(--primary-color) 0%, var(--primary-color) var(--percent, 50%), #d1d5db var(--percent, 50%), #d1d5db 100% );
        border-radius: 999px;
        outline: none;
    }

        /* WebKit thumb */
        #gmaRange::-webkit-slider-thumb {
            appearance: none;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 4px solid #fff;
            box-shadow: 0 0 0 1px rgba(8, 118, 133, 0.18), var(--lwc-shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.08));
            cursor: pointer;
            transition: transform var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), box-shadow var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
        }

        #gmaRange:not(:disabled):active::-webkit-slider-thumb {
            transform: scale(1.08);
            box-shadow: 0 0 0 5px rgba(8, 118, 133, 0.14);
        }

        /* Firefox track and thumb */
        #gmaRange::-moz-range-track {
            background: linear-gradient( 90deg, var(--primary-color) 0%, var(--primary-color) var(--percent, 50%), #d1d5db var(--percent, 50%), #d1d5db 100% );
            height: .5rem;
            border-radius: 999px;
            border: none;
        }

        #gmaRange::-moz-range-thumb {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 4px solid #fff;
            box-shadow: 0 0 0 1px rgba(8, 118, 133, 0.18), var(--lwc-shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.08));
            transition: transform var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), box-shadow var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
        }

        #gmaRange:not(:disabled):active::-moz-range-thumb {
            transform: scale(1.08);
            box-shadow: 0 0 0 5px rgba(8, 118, 133, 0.14);
        }

    #gmaBubble {
        position: absolute;
        top: 0;
        bottom: auto;
        left: var(--percent, 50%);
        transform: translateX(-50%);
        background: #fff;
        color: var(--primary-color);
        font-size: 2.8rem;
        font-weight: 600;
        padding: 0.8rem 1.6rem;
        border: 2px solid var(--primary-color);
        border-radius: 2rem;
        box-shadow: 0 0.75rem 1.8rem rgba(2, 8, 23, 0.24), 0 0 0 1px rgba(255,255,255,.12) inset;
        pointer-events: none;
        white-space: nowrap;
        z-index: 10002;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.38rem;
    }

    #gmaRealBubble {
        position: absolute;
        top: 0;
        bottom: auto;
        left: var(--percent, 50%);
        transform: translateX(-50%);
        background: #fff;
        color: var(--primary-color);
        font-size: 2.8rem;
        font-weight: 600;
        padding: 0.8rem 1.6rem;
        border: 2px solid var(--primary-color);
        border-radius: 2rem;
        pointer-events: none;
        white-space: nowrap;
        z-index: 10002;
        opacity: 0;
        transform: translateX(-50%) scale(0.62);
        will-change: left, transform;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0.8rem 1.75rem rgba(2, 8, 23, 0.28), 0 0 0 1px rgba(255,255,255,.08) inset;
    }

    #gmaRealBubble.is-travelling {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }

    #gmaRealBubble.is-settled {
        opacity: 1;
        animation: gma-real-age-settle calc(var(--lwc-duration-normal, 220ms) * 4) var(--lwc-ease, ease) both;
    }

    @keyframes gma-real-age-settle {
        0% {
            transform: translateX(-50%) scale(0.86);
            box-shadow: 0 0.8rem 1.75rem rgba(2, 8, 23, 0.28), 0 0 0 rgba(25, 195, 209, 0);
        }
        48% {
            transform: translateX(-50%) scale(1.24);
            box-shadow: 0 1rem 2rem rgba(2, 8, 23, 0.3), 0 0 2.4rem var(--gma-settle-glow, rgba(25, 195, 209, 0.72));
        }
        74% {
            transform: translateX(-50%) scale(0.97);
            box-shadow: 0 0.8rem 1.75rem rgba(2, 8, 23, 0.28), 0 0 1rem var(--gma-settle-afterglow, rgba(25, 195, 209, 0.28));
        }
        100% {
            transform: translateX(-50%) scale(1);
            box-shadow: 0 0.8rem 1.75rem rgba(2, 8, 23, 0.28), 0 0 0 rgba(25, 195, 209, 0);
        }
    }

        #gmaRealBubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 20px;
            height: 20px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            background: #fff;
            border-left: 4px solid var(--primary-color);
            border-bottom: 4px solid var(--primary-color);
        }

    #gmaBubble::after {
        content: '';
        position: absolute;
        bottom: -10px;
        width: 20px;
        height: 20px;
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
        background: #fff;
        border-left: 4px solid var(--primary-color);
        border-bottom: 4px solid var(--primary-color);
    }

    /* action buttons */
    .gma-actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
        transition: opacity var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
    }

    .gma-result-actions {
        display: flex;
        justify-content: center;
        min-height: 48px;
        margin-top: 0.55rem;
        transition: opacity var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), transform var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease);
    }

    .gma-result-actions[hidden] {
        display: none;
    }

    @media (prefers-reduced-motion: no-preference) {
        .gma-result-actions.is-visible.is-promoted {
            animation: gma-cta-promote calc(var(--lwc-duration-normal, 220ms) * 2) var(--lwc-ease, ease) both;
        }
    }

    @keyframes gma-cta-promote {
        from { opacity: 0.42; transform: scale(0.94); }
        68% { opacity: 1; transform: scale(1.035); }
        to { opacity: 1; transform: scale(1); }
    }

    .gma-result-actions.is-pending {
        opacity: 0.42;
        transform: scale(0.94);
    }

    .gma-result-actions.is-promoted {
        opacity: 1;
        transform: scale(1);
    }

    .gma-payoff-region {
        width: 100%;
        min-height: 0;
        display: grid;
        place-items: center;
        margin: 0;
        overflow: visible;
        transition: min-height var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), margin var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease);
    }

    .gma-card.is-revealing .gma-payoff-region:not(:empty) {
        min-height: 68px;
        margin: 0.35rem 0 0.2rem;
    }

    .gma-result-actions .gma-btn {
        min-width: 160px;
    }

    .gma-btn {
        padding: 1.2rem 2.4rem;
        font-size: 1.2rem;
        min-width: 140px;
        min-height: 48px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        transition: background var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), color var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease), transform var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease), box-shadow var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
    }

    .gma-btn--primary {
        background: var(--primary-color);
        color: #fff;
    }

        .gma-btn--primary:hover {
            background: var(--primary-color);
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

    .gma-btn--ghost {
        background: transparent;
        color: var(--primary-color);
        border: 2px solid var(--primary-color);
        padding: 0.8rem 1.6rem;
        font-size: 1rem;
        min-width: 100px;
        min-height: 44px;
    }

        .gma-btn--ghost:hover {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

    /* small screens - keep it tight */
    @media (max-width: 420px) {
        /* adjust buttons on small screens */
        .gma-actions {
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .gma-btn {
            flex: 1 1 auto;
            min-width: 0;
        }

        .gma-btn--ghost {
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
        }

        .gma-btn--primary {
            font-size: 1.1rem;
            padding: 0.6rem 1.2rem;
        }

        .gma-result-actions .gma-btn {
            font-size: 1rem;
            padding: 0.75rem 1.25rem;
        }

        .gma-card {
            padding: 1.5rem 1.25rem;
        }

        .gma-avatar {
            width: 116px;
        }

        /* reduce text size on small screens */
        .gma-heading {
            font-size: 2rem;
        }

        .chrono-age-heading {
            font-size: 2rem;
        }

        #gmaBubble,
        #gmaRealBubble {
            font-size: 1.65rem;
            padding: 0.4rem 0.8rem;
        }

        .gma-slider-wrap {
            margin: 0.25rem auto 0.75rem;
            padding-top: 3.75rem;
        }

        /* Keep result feedback readable without covering the task. */
        .gma-pop-banner {
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            gap: 0.25rem;
        }

    }

    @keyframes gma-card-exit {
        from {
            opacity: 1;
            max-height: var(--gma-exit-height, 60rem);
            transform: translateY(0) scale(1);
        }
        to {
            opacity: 0;
            max-height: 0;
            padding-block: 0;
            margin-block: 0;
            border-width: 0;
            transform: translateY(0.35rem) scale(0.985);
        }
    }

    /* Exit is a measured max-height animation: auto -> 0 would only hard-cut. */
    #detailsModal .modal-content #guessAgeContainer.gma-done {
        overflow: hidden;
        animation: gma-card-exit var(--lwc-duration-normal, 220ms) var(--lwc-ease, ease) both !important;
        pointer-events: none;
    }

    #detailsModal .modal-content.gma-fast #guessAgeContainer.gma-done {
        animation-duration: var(--lwc-duration-fast, 140ms) !important;
    }

    .gma-troll-note {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        align-items: center;
        gap: 0.75rem;
        width: min(100%, 32rem);
        margin: 0 auto 1rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--athlete-modal-cream-border, var(--lwc-border, rgba(255, 255, 255, 0.24)));
        border-inline-start: 4px solid var(--lwc-accent-bright, #19c3d1);
        border-radius: var(--lwc-radius-md, 8px);
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        text-align: left;
    }

    .gma-troll-note[hidden] {
        display: none;
    }

    .gma-troll-note img {
        display: block;
        width: 48px;
        height: 48px;
        object-fit: contain;
    }

    .gma-troll-note p {
        margin: 0;
        line-height: 1.4;
    }

    .gma-troll-note a {
        color: inherit;
        font-weight: 700;
        text-decoration-thickness: 0.1em;
        text-underline-offset: 0.14em;
    }

    @keyframes gma-troll-note-enter {
        0% { opacity: 0; transform: translateY(-0.45rem) scale(0.9); }
        58% { opacity: 1; transform: translateY(0.08rem) scale(1.035); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: no-preference) {
        .gma-troll-note.is-visible {
            animation: gma-troll-note-enter calc(var(--lwc-duration-normal, 220ms) * 3) var(--lwc-ease, ease) both;
        }
    }

    .gma-troll-reaction {
        position: fixed;

        #detailsModal .modal-content #guessAgeContainer.gma-done,
        .gma-heading,
        .gma-actions,
        .gma-actions.gma-actions-hide,
        .gma-result-actions,
        .gma-payoff-region,
        .gma-slider-wrap,
        #detailsModal .modal-content.guess-mode #athlete-profile .portrait-wrapper,
        .chrono-age-heading,
        .gma-reaction,
        .gma-troll-reaction,
        .gma-celebration-spark,
        #gmaRange,
        #gmaBubble,
        #gmaRealBubble {
            animation: none !important;
            transition: none !important;
        }

        .gma-pop-banner {
            transform: translateY(0) scale(1);
        }

        #gmaRealBubble.is-settled {
            transform: translateX(-50%) scale(1);
        }

        .gma-reaction,
        .gma-troll-reaction,
        .gma-celebration-spark {
            display: none !important;
        }

        #detailsModal .modal-content #guessAgeContainer.gma-done {
            opacity: 0;
            max-height: 0;
            padding-block: 0;
            margin-block: 0;
            border-width: 0;
            overflow: hidden;
        }
    }
</style>

<div id="guessAgeContainer" class="gma-card">
    <h3 class="gma-heading">Guess my age!</h3>
    <h3 class="chrono-age-heading" style="display: none;">My real age is:</h3>
    <p id="gmaStatus" class="smaller-text" role="status" aria-atomic="true" tabindex="-1" hidden></p>
    <div id="gmaTrollNote" class="gma-troll-note" role="status" aria-atomic="true" hidden>
        <img src="{{ASSET_TROLLFACE}}" alt="" width="48" height="48" loading="lazy" decoding="async" />
        <p>Nice try. Pick another age, or <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">claim your rickroll</a>.</p>
    </div>

    <div class="gma-slider-wrap">
        <input type="range"
               min="1"
               max="130"
               value="33"
               id="gmaRange"
               aria-label="Guess athlete’s age — 1 to 130 years" />

        <output for="gmaRange" id="gmaBubble">33</output>
    </div>

    <div id="gmaPayoffRegion" class="gma-payoff-region" aria-hidden="true"></div>

    <div class="gma-actions">
        <button id="gmaSkipAll" class="gma-btn gma-btn--ghost" style="display: none;" title="The Guess my age game will no longer appear for any athlete">Skip all</button>
        <button class="gma-btn gma-btn--ghost">Skip</button>
        <button class="gma-btn gma-btn--primary">Submit</button>
    </div>
    <div class="gma-result-actions" hidden>
        <button id="gmaContinueBtn" class="gma-btn gma-btn--ghost">See profile</button>
    </div>
</div>

<script>
    /* === Guess-My-Age bindings for the new widget === */
    const gmaRange = document.getElementById('gmaRange');
    const gmaDefaultValue = gmaRange.value;

    const gmaBubble = document.getElementById('gmaBubble');
    const gmaCard = document.querySelector('.gma-card');
    const gmaSliderWrap = gmaCard.querySelector('.gma-slider-wrap');

    const heading = gmaCard.querySelector('.gma-heading');
    const chronoHeading = gmaCard.querySelector('.chrono-age-heading');
    const gmaStatus = document.getElementById('gmaStatus');
    const gmaTrollNote = document.getElementById('gmaTrollNote');

    const modalContent = document.querySelector('#detailsModal .modal-content');
    const gmaActions = gmaCard.querySelector('.gma-actions');
    const gmaResultActions = gmaCard.querySelector('.gma-result-actions');
    const gmaContinueBtn = document.getElementById('gmaContinueBtn');
    const gmaPayoffRegion = document.getElementById('gmaPayoffRegion');
    const GMA_RESULT_PRELUDE_MS = 1980;
    const GMA_MAX_TRAVEL_MS = 7000;
    let gmaWasGuessMode = modalContent.classList.contains('guess-mode');
    let gmaObservedAthleteSlug = modalContent.dataset.athleteSlug || '';
    let gmaPresentationGeneration = 0;
    let cancelCurrentGmaReveal = null;
    let gmaExitTimer = 0;

    function cancelGmaPresentation() {
        gmaPresentationGeneration += 1;

        const cancelReveal = cancelCurrentGmaReveal;
        cancelCurrentGmaReveal = null;
        if (cancelReveal) cancelReveal();

        if (gmaExitTimer) {
            window.clearTimeout(gmaExitTimer);
            gmaExitTimer = 0;
        }
    }

    function beginGmaPresentation(athleteSlug) {
        cancelGmaPresentation();
        return {
            athleteSlug,
            generation: gmaPresentationGeneration
        };
    }

    function isCurrentGmaPresentation(presentation) {
        return presentation.generation === gmaPresentationGeneration
            && modalContent.classList.contains('guess-mode')
            && modalContent.dataset.athleteSlug === presentation.athleteSlug;
    }

    // whenever the modal’s class list changes, if we just opened “guess-mode”,
    // remove any lingering hide classes so buttons reappear
    const resetObserver = new MutationObserver(mutations => {
        const isGuessMode = modalContent.classList.contains('guess-mode');
        const athleteSlug = modalContent.dataset.athleteSlug || '';
        const guessModeWasAbsentDuringBatch = mutations.some(mutation =>
            mutation.attributeName === 'class'
            && !String(mutation.oldValue || '').split(/\s+/).includes('guess-mode'));
        const openedOrChangedAthlete = isGuessMode
            && (!gmaWasGuessMode
                || athleteSlug !== gmaObservedAthleteSlug
                || guessModeWasAbsentDuringBatch);

        if (openedOrChangedAthlete) {
            cancelGmaPresentation();
            setGuessMyAgeParam(true);
            // hide the chrono prompt again
            chronoHeading.style.display = 'none';
            // restore the original prompt
            heading.style.display = '';
            chronoHeading.classList.remove('is-revealing');
            gmaStatus.hidden = true;
            gmaStatus.classList.remove('gma-status--semantic');
            gmaStatus.textContent = '';
            gmaTrollNote.hidden = true;
            gmaTrollNote.classList.remove('is-visible');
            gmaCard.removeAttribute('aria-busy');
            gmaActions.classList.remove('gma-actions-hide');
            gmaActions.inert = false;
            gmaResultActions.hidden = true;
            gmaResultActions.classList.remove('is-visible', 'is-pending', 'is-promoted');
            gmaCard.classList.remove('gma-done');
            gmaCard.style.removeProperty('--gma-exit-height');
            gmaCard.classList.remove('is-submitting', 'is-revealing');

            gmaBubble.classList.remove('gma-bubble-inactive');

            const oldRealBubble = document.getElementById('gmaRealBubble');
            if (oldRealBubble) oldRealBubble.remove();

            gmaRange.value = gmaDefaultValue;
            gmaRange.disabled = false;
            gmaRange.style.pointerEvents = '';
            setGmaRangeResultState(false);
            gmaSubmitBtn.disabled = false;
            syncRange();
            gmaRange.focus({ preventScroll: true });

            gmaCard.classList.remove('celebrate-exact', 'celebrate-better');
            clearGmaEphemera();
        } else if (!isGuessMode && gmaWasGuessMode) {
            cancelGmaPresentation();
            clearGmaEphemera();
            setGuessMyAgeParam(false);
        }

        gmaWasGuessMode = isGuessMode;
        gmaObservedAthleteSlug = athleteSlug;
    });

    resetObserver.observe(modalContent, { attributes: true, attributeOldValue: true });

    function gmaGeometryForAge(age) {
        const min = +gmaRange.min;
        const max = +gmaRange.max;
        const clampedAge = clampGmaAge(age);
        const ratio = max === min ? 0 : (clampedAge - min) / (max - min);
        const rangeRect = gmaRange.getBoundingClientRect();
        const wrapRect = gmaSliderWrap.getBoundingClientRect();
        const thumbSize = Number.parseFloat(
            getComputedStyle(gmaRange).getPropertyValue('--gma-thumb-size')) || 64;

        if (rangeRect.width <= 0 || wrapRect.width <= 0) {
            return {
                bubbleLeft: null,
                fillPercent: ratio * 100
            };
        }

        const thumbCenter = (thumbSize / 2)
            + (ratio * Math.max(0, rangeRect.width - thumbSize));
        return {
            bubbleLeft: (rangeRect.left - wrapRect.left) + thumbCenter,
            fillPercent: (thumbCenter / rangeRect.width) * 100
        };
    }

    function positionGmaBubble(element, age) {
        const geometry = gmaGeometryForAge(age);
        element.dataset.age = String(age);
        element.style.left = geometry.bubbleLeft == null
            ? `${geometry.fillPercent}%`
            : `${geometry.bubbleLeft}px`;
        return geometry;
    }

    function setGmaRangeProgress(age) {
        const geometry = gmaGeometryForAge(age);
        gmaRange.dataset.visualAge = String(age);
        gmaRange.style.setProperty('--percent', `${geometry.fillPercent}%`);
    }

    function syncRange() {
        const val = +gmaRange.value;
        gmaBubble.textContent = val;
        positionGmaBubble(gmaBubble, val);
        setGmaRangeProgress(val);
    }

    function setGmaRangeResultState(isResult) {
        if (isResult) {
            gmaRange.setAttribute('aria-hidden', 'true');
            gmaRange.inert = true;
            return;
        }

        gmaRange.removeAttribute('aria-hidden');
        gmaRange.inert = false;
    }

    gmaRange.addEventListener('input', syncRange);
    syncRange();   // initialise bubble

    function prefersReducedGmaMotion() {
        return typeof window.matchMedia === 'function'
            && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function clampGmaAge(age) {
        return Math.min(Math.max(age, +gmaRange.min), +gmaRange.max);
    }

    function positionGmaRevealBubble(realBubble, age) {
        const clampedAge = clampGmaAge(age);
        const displayedAge = Math.round(clampedAge);
        realBubble.textContent = displayedAge;
        positionGmaBubble(realBubble, clampedAge);
        gmaRange.value = displayedAge;
        setGmaRangeProgress(clampedAge);
    }

    function syncGmaGeometry() {
        const submittedAge = Number.parseFloat(gmaBubble.dataset.age || gmaBubble.textContent);
        if (Number.isFinite(submittedAge)) positionGmaBubble(gmaBubble, submittedAge);

        const visualAge = Number.parseFloat(gmaRange.dataset.visualAge || gmaRange.value);
        if (Number.isFinite(visualAge)) setGmaRangeProgress(visualAge);

        const realBubble = document.getElementById('gmaRealBubble');
        if (!realBubble) return;
        const revealedAge = Number.parseFloat(realBubble.dataset.age || realBubble.textContent);
        if (Number.isFinite(revealedAge)) positionGmaBubble(realBubble, revealedAge);
    }

    window.addEventListener('resize', () => window.requestAnimationFrame(syncGmaGeometry), { passive: true });

    function startGmaResultPrelude(presentation) {
        heading.style.display = 'none';
        chronoHeading.style.display = 'inline-block';
        chronoHeading.classList.remove('is-revealing');
        void chronoHeading.offsetWidth;
        chronoHeading.classList.add('is-revealing');

        const isImmediate = prefersReducedGmaMotion()
            || (typeof window.matchMedia === 'function'
                && window.matchMedia('(max-width: 768px)').matches);
        const duration = isImmediate
            ? 0
            : modalContent.classList.contains('gma-fast')
                ? 300
                : GMA_RESULT_PRELUDE_MS;
        if (duration === 0) return Promise.resolve(isCurrentGmaPresentation(presentation));

        return new Promise(resolve => {
            let preludeTimer = 0;
            let isFinished = false;
            const motionQuery = typeof window.matchMedia === 'function'
                ? window.matchMedia('(prefers-reduced-motion: reduce)')
                : null;

            function clearMotionListener() {
                if (!motionQuery) return;
                if (typeof motionQuery.removeEventListener === 'function') {
                    motionQuery.removeEventListener('change', handleMotionChange);
                } else if (typeof motionQuery.removeListener === 'function') {
                    motionQuery.removeListener(handleMotionChange);
                }
            }

            function finishPrelude(shouldComplete) {
                if (isFinished) return;
                isFinished = true;
                if (preludeTimer) window.clearTimeout(preludeTimer);
                clearMotionListener();
                if (cancelCurrentGmaReveal === cancelPrelude) cancelCurrentGmaReveal = null;
                resolve(shouldComplete && isCurrentGmaPresentation(presentation));
            }

            function cancelPrelude() {
                finishPrelude(false);
            }

            function handleMotionChange(event) {
                if (event.matches) finishPrelude(true);
            }

            cancelCurrentGmaReveal = cancelPrelude;
            if (motionQuery) {
                if (typeof motionQuery.addEventListener === 'function') {
                    motionQuery.addEventListener('change', handleMotionChange);
                } else if (typeof motionQuery.addListener === 'function') {
                    motionQuery.addListener(handleMotionChange);
                }
            }
            preludeTimer = window.setTimeout(() => finishPrelude(true), duration);
        });
    }

    function animateActualAgeReveal(realBubble, startAge, actualAge, presentation) {
        if (!isCurrentGmaPresentation(presentation)) return Promise.resolve(false);

        const roundedStart = Math.round(clampGmaAge(startAge));
        const roundedActual = Math.round(clampGmaAge(actualAge));
        positionGmaRevealBubble(realBubble, roundedStart);
        realBubble.dataset.revealPhase = 'staged';

        if (prefersReducedGmaMotion()) {
            positionGmaRevealBubble(realBubble, roundedActual);
            realBubble.classList.add('is-settled');
            realBubble.dataset.revealPhase = 'settled';
            return Promise.resolve(true);
        }

        const distance = Math.abs(roundedActual - roundedStart);
        const isExact = distance === 0;
        let detourAge = roundedActual;
        if (isExact) {
            const roomBelow = roundedActual - +gmaRange.min;
            const roomAbove = +gmaRange.max - roundedActual;
            detourAge = clampGmaAge(roundedActual + (roomAbove >= roomBelow ? 50 : -50));
        } else if (distance < 50) {
            const detourDistance = 50 - distance;
            detourAge = clampGmaAge(
                roundedStart + (Math.sign(roundedActual - roundedStart) * detourDistance));
        }

        const targets = detourAge !== roundedActual
            ? [Math.round(detourAge), roundedActual]
            : [roundedActual];
        const segments = targets.map((target, index) => ({
            start: index === 0 ? roundedStart : targets[index - 1],
            end: target,
            phase: index === 0 && targets.length > 1 ? 'detour' : targets.length > 1 ? 'return' : 'direct'
        }));
        const totalSteps = segments.reduce(
            (total, segment) => total + Math.abs(segment.end - segment.start),
            0);
        const travelBudget = Math.min(
            GMA_MAX_TRAVEL_MS,
            Math.max(3200, 1900 + (totalSteps * 55)));
        const delayWeights = Array.from(
            { length: Math.max(totalSteps, 1) },
            (_, index) => 0.3 + (0.7 * Math.pow((index + 1) / Math.max(totalSteps, 1), 2)));
        const weightTotal = delayWeights.reduce((total, weight) => total + weight, 0);

        realBubble.dataset.travelSteps = String(totalSteps);
        realBubble.dataset.travelBudget = String(travelBudget);

        return new Promise(resolve => {
            let revealTimer = 0;
            let revealFallbackTimer = 0;
            let isFinished = false;
            let segmentIndex = 0;
            let currentAge = roundedStart;
            let completedSteps = 0;
            const motionQuery = typeof window.matchMedia === 'function'
                ? window.matchMedia('(prefers-reduced-motion: reduce)')
                : null;

            function clearMotionListener() {
                if (!motionQuery) return;
                if (typeof motionQuery.removeEventListener === 'function') {
                    motionQuery.removeEventListener('change', handleMotionChange);
                } else if (typeof motionQuery.removeListener === 'function') {
                    motionQuery.removeListener(handleMotionChange);
                }
            }

            function finishReveal(shouldSettle) {
                if (isFinished) return;
                isFinished = true;
                if (revealTimer) window.clearTimeout(revealTimer);
                if (revealFallbackTimer) window.clearTimeout(revealFallbackTimer);
                clearMotionListener();
                if (cancelCurrentGmaReveal === cancelReveal) cancelCurrentGmaReveal = null;

                const canSettle = shouldSettle && isCurrentGmaPresentation(presentation);
                if (canSettle) {
                    positionGmaRevealBubble(realBubble, roundedActual);
                    realBubble.classList.remove('is-travelling', 'is-returning');
                    realBubble.classList.add('is-settled');
                    realBubble.dataset.revealPhase = 'settled';
                }
                resolve(canSettle);
            }

            function cancelReveal() {
                finishReveal(false);
            }

            function handleMotionChange(event) {
                if (event.matches) finishReveal(true);
            }

            function scheduleNextTick() {
                if (!isCurrentGmaPresentation(presentation)) {
                    finishReveal(false);
                    return;
                }
                if (prefersReducedGmaMotion()) {
                    finishReveal(true);
                    return;
                }

                const segment = segments[segmentIndex];
                if (!segment) {
                    finishReveal(true);
                    return;
                }
                if (currentAge === segment.end) {
                    segmentIndex += 1;
                    scheduleNextTick();
                    return;
                }

                const step = Math.sign(segment.end - currentAge);
                const delay = travelBudget * (delayWeights[completedSteps] / weightTotal);
                revealTimer = window.setTimeout(() => {
                    revealTimer = 0;
                    currentAge += step;
                    completedSteps += 1;
                    realBubble.dataset.revealPhase = segment.phase;
                    realBubble.classList.toggle('is-returning', segment.phase === 'return');
                    positionGmaRevealBubble(realBubble, currentAge);
                    scheduleNextTick();
                }, delay);
            }

            cancelCurrentGmaReveal = cancelReveal;
            if (motionQuery) {
                if (typeof motionQuery.addEventListener === 'function') {
                    motionQuery.addEventListener('change', handleMotionChange);
                } else if (typeof motionQuery.addListener === 'function') {
                    motionQuery.addListener(handleMotionChange);
                }
            }
            realBubble.classList.add('is-travelling');
            realBubble.dataset.revealPhase = segments[0]?.phase || 'direct';
            revealFallbackTimer = window.setTimeout(
                () => finishReveal(true),
                GMA_MAX_TRAVEL_MS + 200);
            scheduleNextTick();
        });
    }

    function showGmaReaction(reaction) {
        if (prefersReducedGmaMotion()) return;
        const portrait = document.getElementById('modalProfilePic');
        if (!portrait) return;

        const rect = portrait.getBoundingClientRect();
        const reactionElement = document.createElement('div');
        reactionElement.className = `gma-reaction gma-reaction--${reaction}`;
        reactionElement.setAttribute('aria-hidden', 'true');
        reactionElement.textContent = reaction === 'exact' ? '👀' : reaction === 'younger' ? '🙌' : '😭';
        const isNarrowPhone = window.innerWidth <= 420;
        const desiredX = isNarrowPhone
            ? rect.left - Math.min(30, rect.width * 0.12)
            : rect.right + Math.min(96, rect.width * 0.26);
        const desiredY = rect.top + (rect.height * (isNarrowPhone ? 0.28 : 0.44));
        reactionElement.dataset.placement = 'beside-portrait';
        document.body.appendChild(reactionElement);

        let reactionX = Math.min(window.innerWidth - 72, desiredX);
        let reactionY = desiredY;
        if (isNarrowPhone) {
            // Clamp the complete animated glyph, not just its anchor. The reaction reaches
            // 1.16x scale with a small rotation, so 1.25x is a safe visual envelope.
            const horizontalInset = Math.min(
                window.innerWidth / 2,
                (reactionElement.offsetWidth * 1.25 / 2) + 8);
            const verticalInset = Math.min(
                window.innerHeight / 2,
                (reactionElement.offsetHeight * 1.25) + 8);
            reactionX = Math.min(
                window.innerWidth - horizontalInset,
                Math.max(horizontalInset, desiredX));
            reactionY = Math.min(
                window.innerHeight - verticalInset,
                Math.max(verticalInset, desiredY));
        }

        reactionElement.style.setProperty('--gma-reaction-x', `${reactionX}px`);
        reactionElement.style.setProperty('--gma-reaction-y', `${reactionY}px`);
        reactionElement.addEventListener('animationend', () => reactionElement.remove(), { once: true });
        window.setTimeout(() => reactionElement.remove(), 2200);
    }

    function showGmaTrollReaction() {
        if (prefersReducedGmaMotion()) return;
        const portrait = document.getElementById('modalProfilePic');
        const source = gmaTrollNote.querySelector('img');
        if (!portrait || !source) return;

        document.querySelectorAll('.gma-troll-reaction').forEach(element => element.remove());
        const rect = portrait.getBoundingClientRect();
        const troll = document.createElement('img');
        troll.className = 'gma-troll-reaction';
        troll.setAttribute('aria-hidden', 'true');
        troll.alt = '';
        troll.src = source.currentSrc || source.src;
        troll.style.setProperty('--gma-reaction-x', `${rect.left + (rect.width / 2)}px`);
        troll.style.setProperty('--gma-reaction-y', `${rect.top + (rect.height / 2)}px`);
        troll.style.animationPlayState = 'paused';
        troll.dataset.animationState = 'queued';
        document.body.appendChild(troll);
        troll.addEventListener('animationend', () => troll.remove(), { once: true });
        window.requestAnimationFrame(() => window.requestAnimationFrame(() => {
            if (!troll.isConnected) return;

            // Start the bounded reaction only after the browser has had a paint opportunity.
            // Otherwise a loaded main thread can advance the entire CSS animation between
            // frames and remove the easter egg before the player ever sees it.
            troll.dataset.animationState = 'running';
            troll.style.animationPlayState = 'running';
            window.setTimeout(() => troll.remove(), 2200);
        }));
    }

    function spawnGmaCelebration(kind) {
        if (prefersReducedGmaMotion()) return;

        const isExact = kind === 'exact';
        const isFirst = kind === 'first';
        const origin = document.getElementById('gmaRealBubble') || gmaCard;
        const rect = origin.getBoundingClientRect();
        const modalRect = modalContent.getBoundingClientRect();
        const centerX = rect.left + (rect.width / 2);
        const centerY = rect.top + (rect.height / 2);
        const icons = isFirst
            ? ['medal', 'flag-checkered', 'stopwatch', 'calendar-check']
            : ['clock', 'stopwatch', 'hourglass-half', 'calendar-check'];
        const sparkCount = isExact ? 64 : isFirst ? 28 : 48;
        const radiusX = Math.min(360, modalRect.width * 0.46);
        const radiusY = Math.min(420, modalRect.height * 0.38);

        for (let index = 0; index < sparkCount; index++) {
            const angle = ((Math.PI * 2) / sparkCount) * index - (Math.PI / 2);
            const distanceScale = 0.68 + ((index % 5) * 0.08);
            const deltaX = Math.cos(angle) * radiusX * distanceScale;
            const deltaY = Math.sin(angle) * radiusY * distanceScale;
            const spark = document.createElement('i');
            spark.className = `gma-celebration-spark fas fa-${icons[index % icons.length]}`;
            spark.setAttribute('aria-hidden', 'true');
            spark.dataset.quadrant = `${deltaX >= 0 ? 'right' : 'left'}-${deltaY >= 0 ? 'bottom' : 'top'}`;
            spark.style.setProperty('--gma-spark-x', `${centerX}px`);
            spark.style.setProperty('--gma-spark-y', `${centerY}px`);
            spark.style.setProperty('--gma-spark-dx', `${deltaX}px`);
            spark.style.setProperty('--gma-spark-dy', `${deltaY}px`);
            spark.style.setProperty('--gma-spark-rotation', `${index % 2 === 0 ? 140 : -140}deg`);
            spark.style.setProperty('--gma-spark-size', `${1.3 + ((index % 4) * 0.2)}rem`);
            spark.style.animationDelay = `${(index % 2) * 140}ms`;
            if (isExact || isFirst) spark.style.setProperty('--gma-spark-color', '#9a6700');
            document.body.appendChild(spark);
            spark.addEventListener('animationend', () => spark.remove(), { once: true });
            window.setTimeout(() => spark.remove(), 3400);
        }
    }

    function clearGmaEphemera() {
        document.querySelectorAll('.gma-reaction, .gma-troll-reaction, .gma-celebration-spark, .gma-pop-banner')
            .forEach(element => element.remove());
    }

    function persistGmaGuessState(athleteSlug, guessState) {
        try {
            if (window.LwcGuessState) {
                window.LwcGuessState.set(athleteSlug, guessState);
                return true;
            }

            const allGuesses = JSON.parse(localStorage.getItem('gmaAllGuesses') || '{}');
            allGuesses[athleteSlug] = guessState;
            localStorage.setItem('gmaAllGuesses', JSON.stringify(allGuesses));
            return true;
        } catch (error) {
            console.warn('Could not persist Guess My Age state.', error);
            return false;
        }
    }

    function scheduleGmaExit(athleteSlug, presentationGeneration, dwell) {
        if (gmaExitTimer) window.clearTimeout(gmaExitTimer);

        const canExit = () => modalContent.classList.contains('guess-mode')
            && modalContent.dataset.athleteSlug === athleteSlug
            && (presentationGeneration == null || presentationGeneration === gmaPresentationGeneration);

        const beginExit = () => {
            gmaExitTimer = 0;
            if (!canExit()) return;

            gmaCard.style.setProperty(
                '--gma-exit-height',
                `${Math.ceil(gmaCard.getBoundingClientRect().height)}px`);
            gmaCard.classList.add('gma-done');
            const exitDelay = prefersReducedGmaMotion()
                ? 0
                : modalContent.classList.contains('gma-fast')
                    ? 180
                    : 260;
            gmaExitTimer = window.setTimeout(() => {
                gmaExitTimer = 0;
                if (!canExit()) return;

                clearGmaEphemera();
                modalContent.classList.remove('guess-mode');
                modalContent.scrollTop = 0;
                modalContent.scrollLeft = 0;
                document.getElementById('closeAthleteDetailsModal')?.focus({ preventScroll: true });
            }, exitDelay);
        };

        if (dwell > 0) {
            gmaExitTimer = window.setTimeout(beginExit, dwell);
        } else {
            beginExit();
        }
    }

    function restoreGuessControls(message, focusTarget) {
        gmaCard.removeAttribute('aria-busy');
        gmaCard.classList.remove('is-submitting', 'is-revealing');
        heading.style.display = '';
        chronoHeading.style.display = 'none';
        chronoHeading.classList.remove('is-revealing');
        gmaStatus.classList.remove('gma-status--semantic');
        gmaStatus.hidden = !message;
        gmaStatus.textContent = message || '';
        gmaActions.classList.remove('gma-actions-hide');
        gmaActions.inert = false;
        gmaResultActions.hidden = true;
        gmaResultActions.classList.remove('is-visible', 'is-pending', 'is-promoted');
        gmaRange.disabled = false;
        gmaRange.style.pointerEvents = '';
        setGmaRangeResultState(false);
        gmaSubmitBtn.disabled = false;
        gmaBubble.classList.remove('gma-bubble-inactive');
        document.getElementById('gmaRealBubble')?.remove();
        clearGmaEphemera();
        syncRange();
        (focusTarget || gmaRange).focus();
    }

    const gmaSubmitBtn = gmaCard.querySelector('.gma-btn--primary');
    gmaSubmitBtn.addEventListener('click', async function () {
        const userGuess = +gmaRange.value;

        if (userGuess === +gmaRange.min || userGuess === +gmaRange.max) {
            gmaTrollNote.hidden = false;
            gmaTrollNote.classList.remove('is-visible');
            void gmaTrollNote.offsetWidth;
            gmaTrollNote.classList.add('is-visible');
            restoreGuessControls('', gmaRange);
            showGmaTrollReaction();
            return;
        }

        gmaTrollNote.hidden = true;
        gmaTrollNote.classList.remove('is-visible');
        clearGmaEphemera();
        const presentation = beginGmaPresentation(modalContent.dataset.athleteSlug);
        const preludePromise = startGmaResultPrelude(presentation);

        gmaCard.setAttribute('aria-busy', 'true');
        gmaCard.classList.add('is-submitting');
        gmaStatus.classList.remove('gma-status--semantic');
        gmaStatus.hidden = false;
        gmaStatus.textContent = 'Submitting your guess…';
        gmaStatus.focus({ preventScroll: true });
        gmaActions.classList.add('gma-actions-hide');
        gmaActions.inert = true;
        gmaRange.disabled = true;
        gmaRange.style.pointerEvents = 'none';
        setGmaRangeResultState(true);
        gmaSubmitBtn.disabled = true;

        try {
            const response = await fetch(
                `/api/Guess/athlete-age?athleteName=${encodeURIComponent(presentation.athleteSlug)}&ageGuess=${userGuess}`,
                { method: 'POST' }
            );

            if (!response.ok) {
                throw new Error(`Guess submission failed with status ${response.status}`);
            }

            const result = await response.json();
            const realAge = +result.actualAge;
            if (!Number.isFinite(realAge)) {
                throw new Error('Guess response did not include a valid actual age');
            }

            // GuessAccepted describes inclusion in the public Crowd Age aggregate, not whether
            // the player completed the game. Always reveal a successful response: asking the
            // player to revise after the server has disclosed the real age creates a dead end
            // and would let a filtered guess be replaced with a knowingly correct one.
            const crowdCountBeforeGuess = result.crowdCount === 1 ? 0 : result.crowdCount;
            const isFirstGuess = result.guessAccepted === true && crowdCountBeforeGuess === 0;
            const userError = Math.abs(realAge - userGuess);
            const crowdError = result.crowdAge === 0 || isFirstGuess
                ? null
                : Math.abs(realAge - result.crowdAge);
            const guessState = {
                value: userGuess,
                skipped: false,
                first: isFirstGuess,
                exact: userError === 0
            };

            // The accepted result is durable before any presentation work. A reload, tab switch,
            // or newly opened athlete must never lose or misattribute this completed round.
            persistGmaGuessState(presentation.athleteSlug, guessState);
            if (userError === 0
                && window.proDiscounts
                && typeof window.proDiscounts.setPerfectGuessMarker === 'function') {
                try {
                    window.proDiscounts.setPerfectGuessMarker();
                } catch (error) {
                    console.warn('Could not persist the perfect Guess My Age marker.', error);
                }
            }

            if (!isCurrentGmaPresentation(presentation)) return;
            updateYourGuess();

            updateCrowdContainer(result.crowdAge, result.crowdCount);
            gmaCard.classList.remove('is-submitting');
            gmaCard.classList.add('is-revealing');
            const reactionKind = userGuess === realAge
                ? 'exact'
                : userGuess < realAge
                    ? 'younger'
                    : 'older';
            const reactionCopy = reactionKind === 'exact'
                ? 'Right on the nose.'
                : reactionKind === 'younger'
                    ? 'You guessed younger — high five.'
                    : 'You guessed older — oof.';
            const outcomeCopy = userError === 0
                ? ' Bullseye!'
                : isFirstGuess
                    ? ' First accepted guess!'
                    : crowdError !== null && userError < crowdError
                        ? ' You beat the crowd!'
                        : '';
            gmaStatus.classList.add('gma-status--semantic');
            gmaStatus.textContent = `Actual age: ${realAge}. Your guess: ${userGuess}. ${reactionCopy}${outcomeCopy}`;
            gmaCard.removeAttribute('aria-busy');
            gmaResultActions.hidden = false;
            gmaResultActions.classList.remove('is-promoted');
            gmaResultActions.classList.add('is-visible', 'is-pending');
            showGmaReaction(reactionKind);

            const preludeCompleted = await preludePromise;
            if (!preludeCompleted || !isCurrentGmaPresentation(presentation)) return;

            const realBubble = document.createElement('span');
            realBubble.id = 'gmaRealBubble';
            realBubble.className = 'gma-real-bubble';
            realBubble.setAttribute('aria-hidden', 'true');
            gmaSliderWrap.appendChild(realBubble);

            gmaBubble.classList.add('gma-bubble-inactive');
            const revealCompleted = await animateActualAgeReveal(
                realBubble,
                userGuess,
                realAge,
                presentation);
            if (!revealCompleted || !isCurrentGmaPresentation(presentation)) return;

            gmaResultActions.classList.remove('is-pending');
            gmaResultActions.classList.add('is-promoted');
            gmaContinueBtn.focus({ preventScroll: true });
            document.querySelectorAll('.gma-reaction').forEach(element => element.remove());

            let outcomeDwell = 5000;
            if (userError === 0) {
                gmaCard.classList.add('celebrate-exact');
                outcomeDwell = 6000;
                popBanner(true, false, outcomeDwell);
                spawnGmaCelebration('exact');
            } else if (isFirstGuess) {
                popBanner(false, true, outcomeDwell);
                spawnGmaCelebration('first');
            } else if (crowdError !== null && userError < crowdError) {
                gmaCard.classList.add('celebrate-better');
                popBanner(false, false, outcomeDwell);
                spawnGmaCelebration('crowd');
            }

            scheduleGmaExit(
                presentation.athleteSlug,
                presentation.generation,
                outcomeDwell);
        } catch (error) {
            if (!isCurrentGmaPresentation(presentation)) return;
            cancelGmaPresentation();
            console.error('Error submitting guess:', error);
            restoreGuessControls('We could not submit your guess. Please try again.', gmaSubmitBtn);
        }
    });

    gmaContinueBtn.addEventListener('click', () => {
        const athleteSlug = modalContent.dataset.athleteSlug;
        cancelGmaPresentation();
        clearGmaEphemera();
        scheduleGmaExit(athleteSlug, null, 0);
    });

    // bind hideCard to _all_ ghost buttons (Skip & Skip All)
    gmaActions.querySelectorAll('.gma-btn--ghost')
        .forEach(btn => btn.addEventListener('click', hideCard));
    function hideCard(e) {
        // if they clicked “Skip All”, set global flag
        const isSkipAll = e.currentTarget.id === 'gmaSkipAll';
        if (isSkipAll) {
            try {
                localStorage.setItem('gmaSkipAll', 'true');
            } catch (error) {
                console.warn('Could not persist the Guess My Age skip-all preference.', error);
            }
        }

        const modalContent = document.querySelector('#detailsModal .modal-content');
        const athleteSlug = modalContent.dataset.athleteSlug;
        cancelGmaPresentation();
        persistGmaGuessState(athleteSlug, {
            value: null,
            skipped: true,
            first: false,
            exact: false
        });
        updateYourGuess();
        scheduleGmaExit(athleteSlug, null, 0);
    }

    function popBanner(isExact, isFirst, outcomeDwell) {
        const b = document.createElement('div');
        b.setAttribute('aria-hidden', 'true');
        b.classList.add('gma-pop-banner');
        if (isExact) {
            b.classList.add('gma-pop-banner--golden');
        }

        const bannerCopy = document.createElement('span');
        bannerCopy.textContent = isExact
            ? 'Bullseye!'
            : isFirst
                ? 'First accepted guess!'
                : 'You beat the crowd!';
        const leadingEmoji = isExact ? '🎯🎯🎯 ' : isFirst ? '🥇 ' : '🎉 ';
        const trailingEmoji = isExact ? ' 🎯🎯🎯' : isFirst ? ' 🥇' : ' 🏆';
        b.append(document.createTextNode(leadingEmoji), bannerCopy, document.createTextNode(trailingEmoji));

        gmaPayoffRegion.replaceChildren(b);
        requestAnimationFrame(() => b.classList.add('show'));

        const bannerDwell = prefersReducedGmaMotion()
            ? 1200
            : Math.max(2000, outcomeDwell - 600);
        setTimeout(() => {
            b.classList.add('hide');
            b.addEventListener('animationend', () => b.remove(), { once: true });
            setTimeout(() => b.remove(), 600);
        }, bannerDwell);

    }

    function setGuessMyAgeParam(active) {
        const url = new URL(window.location.href);
        if (active) url.searchParams.set('guessmyage', '1');
        else url.searchParams.delete('guessmyage');
        history.replaceState(history.state || {}, "", url.toString());
    }
</script>
