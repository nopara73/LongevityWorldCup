<link rel="stylesheet" href="{{ASSET_EVENT_BOARD_CSS}}">

<div id="events-root" class="events-board" aria-busy="true">
    <div id="eventsStatus" class="events-status" role="status" aria-live="polite" aria-atomic="true">Loading events...</div>
    <table id="eventsTable">
        <colgroup>
            <col class="events-col-avatar">
            <col class="events-col-message">
            <col class="events-col-date">
        </colgroup>
        <thead>
        <tr>
            <th colspan="3">
                <div class="header-bar">
                    <span>Highlights</span>
                    <a class="view-all" id="eventsViewAll" href="/events" target="_top">View all</a>
                </div>
            </th>
        </tr>
        </thead>
        <tbody>
        <tr class="events-skeleton-row" aria-hidden="true">
            <td class="col-avatar"><div class="athlete-td"><span class="events-skeleton-avatar skeleton-shimmer"></span></div></td>
            <td class="event-message"><div class="event-message-cell"><span class="events-skeleton-line is-wide skeleton-shimmer"></span></div></td>
            <td class="col-date"></td>
        </tr>
        <tr class="events-skeleton-row" aria-hidden="true">
            <td class="col-avatar"><div class="athlete-td"><span class="events-skeleton-avatar skeleton-shimmer"></span></div></td>
            <td class="event-message"><div class="event-message-cell"><span class="events-skeleton-line is-wide skeleton-shimmer"></span></div></td>
            <td class="col-date"></td>
        </tr>
        <tr class="events-skeleton-row" aria-hidden="true">
            <td class="col-avatar"><div class="athlete-td"><span class="events-skeleton-avatar skeleton-shimmer"></span></div></td>
            <td class="event-message"><div class="event-message-cell"><span class="events-skeleton-line is-wide skeleton-shimmer"></span></div></td>
            <td class="col-date"></td>
        </tr>
        <tr class="events-skeleton-row" aria-hidden="true">
            <td class="col-avatar"><div class="athlete-td"><span class="events-skeleton-avatar skeleton-shimmer"></span></div></td>
            <td class="event-message"><div class="event-message-cell"><span class="events-skeleton-line is-wide skeleton-shimmer"></span></div></td>
            <td class="col-date"></td>
        </tr>
        <tr class="events-skeleton-row" aria-hidden="true">
            <td class="col-avatar"><div class="athlete-td"><span class="events-skeleton-avatar skeleton-shimmer"></span></div></td>
            <td class="event-message"><div class="event-message-cell"><span class="events-skeleton-line is-wide skeleton-shimmer"></span></div></td>
            <td class="col-date"></td>
        </tr>
        </tbody>
    </table>
</div>

<script src="{{ASSET_CUSTOM_EVENT_MARKUP_JS}}"></script>
<script src="{{ASSET_EVENTS_PAGE_JS}}" data-default-profile-pic="{{ASSET_HD_LOGO_THUMB_SM}}"></script>
