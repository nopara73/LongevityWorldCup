<!DOCTYPE html>
<html lang="en">
<head>
    <title>Media kit | Longevity World Cup</title>
    <!--HEAD-->
    <style>
        /* Hide the join-game button in the header */
        .join-game {
            display: none !important;
        }

        /* Press page: one card with a cover band, the kit's hero pictures
           featured large, each folder as its own section card, and the press
           contact closing the card. Every well keeps one shape per section. */
        .media-kit-panel {
            --media-kit-gutter: var(--lwc-space-6);
            box-sizing: border-box;
            max-width: 1080px;
            margin: 2.25rem auto;
            border: 1px solid var(--lwc-border);
            border-radius: var(--lwc-radius-lg);
            background: var(--lwc-surface);
            box-shadow: var(--lwc-shadow-sm);
        }

        .media-kit-head {
            padding: var(--lwc-space-6) var(--media-kit-gutter) var(--lwc-space-5);
            border-bottom: 1px solid var(--lwc-border);
            border-radius: var(--lwc-radius-lg) var(--lwc-radius-lg) 0 0;
            background: var(--lwc-surface-muted);
            text-align: center;
        }

        .media-kit-title {
            margin: 0 0 var(--lwc-space-2);
            text-align: center;
        }

        .media-kit-title[data-aos]:not(.aos-animate) {
            opacity: 1;
            transform: none;
        }

        .media-kit-intro {
            margin: 0 auto;
            max-width: 36rem;
            color: var(--lwc-muted);
            font-size: 1.05rem;
            text-align: center;
        }

        .media-kit-actions {
            margin: var(--lwc-space-5) 0 0;
            text-align: center;
        }

        .media-kit-primary-download {
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            min-height: 48px;
            max-width: 100%;
            padding: 0.8rem 1.5rem;
            border-radius: var(--lwc-radius-md);
            background: var(--lwc-accent);
            color: var(--lwc-on-accent);
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            overflow-wrap: break-word;
            box-shadow: var(--lwc-shadow-sm);
            transition: background-color var(--lwc-duration-fast) var(--lwc-ease), box-shadow var(--lwc-duration-fast) var(--lwc-ease);
        }

        .media-kit-primary-download::before {
            content: "\f019" / "";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 0.95em;
            line-height: 1;
        }

        .media-kit-primary-download:hover,
        .media-kit-primary-download:focus-visible {
            background: var(--lwc-accent-hover);
            color: var(--lwc-on-accent);
            box-shadow: var(--lwc-shadow-md);
        }

        .media-kit-preview {
            display: grid;
            gap: var(--lwc-space-5);
            padding: var(--lwc-space-5) var(--media-kit-gutter) var(--lwc-space-6);
        }

        .media-kit-groups:empty {
            display: none;
        }

        .media-kit-groups {
            display: grid;
            gap: var(--lwc-space-5);
        }

        /* While the archive opens, the page already shows the shape it will have. */
        .media-kit-loading {
            display: grid;
            gap: var(--lwc-space-3);
            color: var(--lwc-muted);
            text-align: center;
        }

        .media-kit-skeleton {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
            gap: var(--lwc-space-4);
        }

        .media-kit-skeleton span {
            aspect-ratio: 3 / 2;
            border: 1px solid var(--lwc-border);
            border-radius: var(--lwc-radius-md);
        }

        .media-kit-skeleton span,
        .media-file-thumb[data-state="loading"] {
            background: linear-gradient(100deg, var(--lwc-surface-muted) 30%, var(--lwc-surface) 50%, var(--lwc-surface-muted) 70%) 0 0 / 300% 100%;
            animation: media-kit-shimmer 1.6s linear infinite;
        }

        @keyframes media-kit-shimmer {
            from { background-position: 100% 0; }
            to { background-position: 0 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .media-kit-skeleton span,
            .media-file-thumb[data-state="loading"] {
                animation: none;
                background: var(--lwc-surface-muted);
            }
        }

        .media-kit-fallback {
            display: flex;
            gap: var(--lwc-space-3);
            align-items: flex-start;
            padding: var(--lwc-space-3) var(--lwc-space-4);
            border: 1px solid var(--lwc-border);
            border-left: 3px solid var(--lwc-warning);
            border-radius: var(--lwc-radius-md);
            background: var(--lwc-warning-soft);
            color: var(--lwc-ink);
            text-align: left;
        }

        .media-kit-fallback::before {
            content: "\f071" / "";
            flex: none;
            color: var(--lwc-warning);
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            line-height: 1.5;
        }

        /* Folder sections: a header band names the folder and its file count,
           and its files sit in one even grid below. */
        .media-kit-group:not(.media-kit-root) {
            border: 1px solid var(--lwc-border);
            border-radius: var(--lwc-radius-lg);
            background: var(--lwc-surface);
        }

        .media-kit-group-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--lwc-space-3);
            padding: var(--lwc-space-3) var(--lwc-space-4);
            border-bottom: 1px solid var(--lwc-border);
            border-radius: var(--lwc-radius-lg) var(--lwc-radius-lg) 0 0;
            background: var(--lwc-surface-muted);
        }

        .media-kit-group-title {
            margin: 0;
            min-width: 0;
            color: var(--lwc-accent-hover);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.3;
            text-align: left;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        .media-kit-group-count {
            flex: none;
            min-width: 1.75rem;
            padding: 0.1rem 0.55rem;
            border: 1px solid var(--lwc-border);
            border-radius: var(--lwc-radius-pill);
            background: var(--lwc-surface);
            color: var(--lwc-muted);
            font-size: var(--lwc-type-xs);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.5;
            text-align: center;
        }

        .media-kit-file-list {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: var(--lwc-space-3);
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .media-kit-group:not(.media-kit-root) > .media-kit-file-list {
            padding: var(--lwc-space-4);
        }

        .media-kit-root {
            display: grid;
            gap: var(--lwc-space-4);
        }

        /* Tile widths follow the text size, so enlarged text gets fewer columns.
           The script then picks, within what fits, the column count that leaves
           the fewest gaps in a folder's last row. */
        .media-kit-tiles {
            --media-kit-tile: 9.5rem;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--media-kit-tile)), 1fr));
            gap: var(--lwc-space-4) var(--lwc-space-3);
        }

        .media-kit-featured {
            --media-kit-tile: 18rem;
            gap: var(--lwc-space-4);
        }

        .media-kit-docs {
            --media-kit-tile: 11rem;
        }

        .media-file-row {
            box-sizing: border-box;
            border: 1px solid var(--lwc-border);
            border-radius: var(--lwc-radius-md);
            background: var(--lwc-surface);
        }

        /* A tile is its picture with the name as the caption below,
           and download is a round mark on the picture's corner. */
        .media-file-tile {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: auto auto;
            align-self: start;
            overflow: hidden;
            transition: border-color var(--lwc-duration-fast) var(--lwc-ease), box-shadow var(--lwc-duration-fast) var(--lwc-ease), transform var(--lwc-duration-fast) var(--lwc-ease);
        }

        .media-file-tile:hover,
        .media-file-tile:focus-within {
            border-color: var(--lwc-accent);
            box-shadow: var(--lwc-shadow-md);
        }

        @media (hover: hover) and (prefers-reduced-motion: no-preference) {
            .media-file-tile:hover {
                transform: translateY(-2px);
            }
        }

        .media-file-thumb {
            position: relative;
            isolation: isolate;
            display: block;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: var(--lwc-surface-muted);
        }

        .media-kit-featured .media-file-thumb {
            aspect-ratio: 3 / 2;
        }

        .media-file-thumb img {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            opacity: 0;
            transition: opacity var(--lwc-duration-normal) var(--lwc-ease);
        }

        .media-file-thumb[data-state="ready"] img {
            opacity: 1;
        }

        /* A photo fills its well with a soft, blurred copy of itself, so a
           portrait in a landscape well reads as one picture, not a strip. */
        .media-file-thumb[data-fill="photo"]::before {
            content: "";
            position: absolute;
            inset: -24px;
            z-index: 0;
            background: var(--media-file-backdrop) center / cover no-repeat;
            filter: blur(18px) brightness(0.9) saturate(1.1);
        }

        /* Transparent artwork sits on a light checkerboard in either theme,
           which is how press tools show a cut-out logo. */
        .media-file-thumb[data-fill="transparent"] {
            background:
                repeating-conic-gradient(#eef2f5 0 25%, #ffffff 0 50%) 0 0 / 16px 16px;
        }

        .media-file-thumb[data-state="failed"] {
            display: grid;
            place-items: center;
            background: var(--lwc-surface-muted);
        }

        .media-file-thumb[data-state="failed"]::after {
            content: "\f03e";
            color: var(--lwc-subtle);
            font-family: "Font Awesome 6 Free";
            font-weight: 400;
            font-size: 2.25rem;
            line-height: 1;
        }

        /* A document shows its file type where a picture would be. */
        .media-file-doc-thumb {
            box-sizing: border-box;
            display: grid;
            place-items: center;
            aspect-ratio: auto;
            min-height: 5.5rem;
            /* Leave the corner mark clear even on narrow, enlarged tiles. */
            padding: var(--lwc-space-3) 52px var(--lwc-space-3) var(--lwc-space-3);
            background: var(--lwc-surface-accent);
        }

        .media-kit-tiles .media-file-doc-thumb {
            aspect-ratio: 4 / 3;
        }

        .media-kit-docs .media-file-doc-thumb {
            aspect-ratio: auto;
        }

        .media-file-icon {
            color: var(--lwc-accent);
            font-size: 2.75rem;
            line-height: 1;
            text-align: center;
        }

        .media-file-name {
            min-width: 0;
            padding: 0.6rem 0.75rem 0.7rem;
            border-top: 1px solid var(--lwc-border);
            color: var(--lwc-ink);
            font-size: var(--lwc-type-sm);
            font-weight: 500;
            line-height: 1.4;
            overflow-wrap: break-word;
            word-break: normal;
        }

        .media-kit-featured .media-file-name {
            padding: 0.75rem 1rem 0.85rem;
            font-size: var(--lwc-type-body);
            font-weight: 700;
        }

        .media-file-button {
            box-sizing: border-box;
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            min-height: 44px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: var(--lwc-radius-pill);
            background: var(--lwc-surface);
            color: var(--lwc-accent);
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.28);
            font-family: inherit;
            font-size: 0;
            cursor: pointer;
            transition: background-color var(--lwc-duration-fast) var(--lwc-ease), color var(--lwc-duration-fast) var(--lwc-ease);
        }

        .media-kit-featured .media-file-button {
            top: 0.75rem;
            right: 0.75rem;
            width: 48px;
            height: 48px;
        }

        .media-file-button::before {
            content: "\f019";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 1rem;
            line-height: 1;
        }

        .media-file-button:hover,
        .media-file-button:focus-visible {
            background: var(--lwc-accent);
            color: var(--lwc-on-accent);
        }

        .media-file-button[data-download-failed] {
            border-color: var(--lwc-warning);
            background: var(--lwc-warning-soft);
            color: var(--lwc-warning);
        }

        .media-file-button[data-download-failed]::before {
            content: "\f01e";
        }

        .media-file-tile:has(.media-file-button[data-download-failed]) {
            border-color: var(--lwc-warning);
        }

        .media-kit-primary-download:focus-visible,
        .media-file-button:focus-visible {
            outline: 3px solid var(--lwc-accent);
            outline-offset: 3px;
        }

        .media-kit-contact {
            margin: 0;
            padding: var(--lwc-space-4) var(--media-kit-gutter);
            border-top: 1px solid var(--lwc-border);
            border-radius: 0 0 var(--lwc-radius-lg) var(--lwc-radius-lg);
            background: var(--lwc-surface-muted);
            color: var(--lwc-muted);
            text-align: center;
            overflow-wrap: anywhere;
        }

        .media-kit-contact::before {
            content: "\f0e0" / "";
            margin-inline-end: 0.5rem;
            color: var(--lwc-accent);
            font-family: "Font Awesome 6 Free";
            font-weight: 400;
        }

        .media-kit-contact a {
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .media-kit-panel {
                --media-kit-gutter: var(--lwc-space-5);
                margin-inline: var(--lwc-space-4);
            }

            .media-kit-tiles:not(.media-kit-featured, .media-kit-docs) {
                --media-kit-tile: 8.5rem;
            }
        }

        /* Phones: limit the side space and let tile widths follow the text size,
           including a single column when captions need the room. */
        @media (max-width: 600px) {
            .media-kit-panel {
                --media-kit-gutter: min(1rem, 4vw);
                margin: var(--lwc-space-4) min(0.75rem, 3vw);
            }

            .media-kit-head {
                padding-top: var(--lwc-space-5);
            }

            .media-kit-title {
                font-size: 2rem;
            }

            .media-kit-intro {
                font-size: var(--lwc-type-body);
            }

            .media-kit-primary-download {
                width: 100%;
                padding-inline: 0.9rem;
            }

            .media-kit-preview,
            .media-kit-groups {
                gap: var(--lwc-space-4);
            }

            .media-kit-group:not(.media-kit-root) > .media-kit-file-list {
                padding: min(0.75rem, 3vw);
            }

            .media-kit-group-head {
                padding: var(--lwc-space-2) min(0.75rem, 3vw);
            }

            .media-kit-tiles:not(.media-kit-featured, .media-kit-docs),
            .media-kit-docs {
                --media-kit-tile: 6.5rem;
                gap: var(--lwc-space-2);
            }

            .media-kit-featured {
                --media-kit-tile: 100vw;
                gap: var(--lwc-space-3);
            }

            .media-file-name {
                padding: 0.5rem min(0.6rem, 3vw) 0.55rem;
                font-size: var(--lwc-type-sm);
                line-height: 1.45;
            }

            .media-kit-featured .media-file-name {
                padding-inline: min(0.85rem, 3vw);
            }

            .media-kit-docs .media-file-doc-thumb {
                min-height: 4.5rem;
            }

            .media-file-icon {
                font-size: 2.25rem;
            }
        }

        @media (max-width: 280px) {
            /* At full phone zoom, put a folder document's glyph below its
               corner control instead of squeezing both into the same line. */
            .media-kit-group:not(.media-kit-root) .media-file-doc-thumb {
                width: 100%;
                min-width: 0;
                aspect-ratio: auto;
                min-height: 8rem;
                padding: calc(44px + var(--lwc-space-3)) min(0.75rem, 3vw) min(0.75rem, 3vw);
            }
        }
    </style>
</head>
<body>
    <!--HEADER-->
    <main>
        <section class="media-kit-panel">
            <div class="media-kit-head">
                <h1 class="media-kit-title" data-aos="fade" data-aos-duration="700" data-aos-delay="250">Media kit</h1>
                <p class="media-kit-intro">Press-ready assets for Longevity World Cup.</p>

                <p class="media-kit-actions">
                    <a href="https://cdn.jsdelivr.net/gh/nopara73/LongevityWorldCup@master/LongevityWorldCup.Documentation/MediaKit.zip"
                       target="_blank" rel="noopener noreferrer"
                       class="media-kit-primary-download">
                        Download full media kit (ZIP)
                    </a>
                </p>
            </div>

            <!-- Live file list extracted from ZIP (auto-load) -->
            <div id="zipPreview" class="media-kit-preview">
                <div id="loading" class="media-kit-loading" role="status">
                    <div class="media-kit-skeleton" aria-hidden="true"><span></span><span></span></div>
                    Loading…
                </div>
                <div id="fileList" class="media-kit-groups"></div>
                <div id="fallback" class="media-kit-fallback" role="status" style="display:none;">
                    Failed to preview. Use the ZIP link above.
                </div>
                <div id="downloadStatus" class="visually-hidden" role="status"></div>
            </div>

            <p class="media-kit-contact">
                Press contact:
                <a href="mailto:hi@longevityworldcup.com">hi@longevityworldcup.com</a>
            </p>
        </section>
    </main>

    <!--FOOTER-->
    <!-- JSZip (client-side unzip) -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" crossorigin="anonymous"></script>
    <script>
        history.replaceState({ modal: 'details' }, "", `/media`);

        const ZIP_PRIMARY = "https://cdn.jsdelivr.net/gh/nopara73/LongevityWorldCup@master/LongevityWorldCup.Documentation/MediaKit.zip";
        const ZIP_FALLBACK = "https://raw.githubusercontent.com/nopara73/LongevityWorldCup/master/LongevityWorldCup.Documentation/MediaKit.zip";

        const loadingEl = document.getElementById('loading');
        const listEl = document.getElementById('fileList');
        const fallbackEl = document.getElementById('fallback');
        // Photo backdrops need their URL for as long as the page is visible.
        // Keep them across bfcache restores; release them on an actual departure.
        const objectUrls = new Set();
        function createFileUrl(blob) {
            const url = URL.createObjectURL(blob);
            objectUrls.add(url);
            return url;
        }
        function releaseFileUrl(url) {
            URL.revokeObjectURL(url);
            objectUrls.delete(url);
        }
        window.addEventListener('pagehide', event => {
            if (event.persisted) return;
            for (const url of objectUrls) releaseFileUrl(url);
        });

        function appendFileName(target, path) {
            for (const part of path.split(/([/_.-])/)) {
                if (!part) continue;

                // A long name wraps after a separator, or before its extension.
                if (part === ".") target.appendChild(document.createElement("wbr"));
                target.appendChild(document.createTextNode(part));
                if (part === "/" || part === "_" || part === "-") {
                    target.appendChild(document.createElement("wbr"));
                }
            }
        }

        async function fetchZip(url) {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error("HTTP " + res.status);
            return await res.arrayBuffer();
        }

        // The scaled picture is at most 520px per side, so inspect every alpha
        // value rather than skipping small cut-outs between sampled pixels.
        function hasTransparency(context, width, height) {
            try {
                const { data } = context.getImageData(0, 0, width, height);
                for (let i = 3; i < data.length; i += 4) if (data[i] < 255) return true;
                return false;
            } catch (_) {
                return null;
            }
        }

        // Larger folders get at least two rows when space permits. Within that
        // limit, trade an unused last-row cell for a column of wider captions.
        function balanceColumns(list) {
            const style = getComputedStyle(list);
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
            const tileValue = style.getPropertyValue('--media-kit-tile').trim();
            const tile = tileValue.endsWith('vw') ? innerWidth * parseFloat(tileValue) / 100 : parseFloat(tileValue) * rem;
            const gap = parseFloat(style.columnGap) || 0;
            const width = list.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            const count = list.children.length;
            if (!count || !(width > 0) || !(tile > 0)) return;
            const fits = Math.min(
                Math.max(1, Math.floor((width + gap) / (tile + gap))),
                count > 3 ? Math.ceil(count / 2) : count);
            let columns = fits;
            if (count > fits) {
                let fewest = Infinity;
                for (let c = fits; c >= Math.max(Math.min(2, fits), Math.ceil(fits / 2)); c--) {
                    const cost = (c - count % c) % c + (fits - c);
                    if (cost < fewest) { fewest = cost; columns = c; }
                }
            }
            const template = `repeat(${columns}, minmax(0px, 1fr))`;
            if (list.style.gridTemplateColumns !== template) list.style.gridTemplateColumns = template;
        }

        // The page is observed too, so a text-size change re-balances lists whose width stays the same.
        const balancedLists = 'ResizeObserver' in window
            ? new ResizeObserver(() => { for (const list of document.querySelectorAll('#fileList .media-kit-tiles')) balanceColumns(list); })
            : null;
        if (balancedLists) balancedLists.observe(document.documentElement);

        async function loadList() {
            try {
                let buf;
                try {
                    buf = await fetchZip(ZIP_PRIMARY);
                } catch (_) {
                    buf = await fetchZip(ZIP_FALLBACK);
                }

                const zip = await JSZip.loadAsync(buf);
                const files = [];
                zip.forEach((path, file) => { if (!file.dir) files.push(path); });
                files.sort();

                // One group per folder inside the kit; files at its top level come first,
                // then folders by name whatever their capitalisation.
                const groups = new Map();
                for (const path of files) {
                    const parts = path.split('/');
                    const folder = parts.length > 2 ? parts.slice(1, -1).join('/') : '';
                    if (!groups.has(folder)) groups.set(folder, []);
                    groups.get(folder).push(path);
                }
                const folders = [...groups.keys()].sort((a, b) =>
                    a === '' ? -1 : b === '' ? 1 : a.localeCompare(b, 'en', { sensitivity: 'base' }) || (a < b ? -1 : 1));

                const imageTypes = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif' };
                const documentTypes = { pdf: 'application/pdf', txt: 'text/plain', md: 'text/markdown', svg: 'image/svg+xml' };
                const extensionOf = path => path.slice(path.lastIndexOf('.') + 1).toLowerCase();
                const typeOf = path => {
                    const extension = extensionOf(path);
                    return Object.hasOwn(imageTypes, extension) ? imageTypes[extension]
                        : Object.hasOwn(documentTypes, extension) ? documentTypes[extension] : 'application/octet-stream';
                };
                const thumbnails = 'IntersectionObserver' in window
                    ? new IntersectionObserver((entries, observer) => {
                        for (const entry of entries) {
                            if (!entry.isIntersecting) continue;
                            observer.unobserve(entry.target);
                            showThumbnail(entry.target);
                        }
                    }, { rootMargin: '600px 0px' })
                    : null;

                // Thumbnails come from the ZIP already in memory, as each tile nears the viewport.
                // Each is scaled down to tile size first, so a page of tiles does not hold
                // twenty full-size pictures decoded at once.
                async function showThumbnail(image) {
                    const path = image.dataset.path;
                    const thumb = image.parentElement;
                    try {
                        const bytes = await zip.file(path).async('arraybuffer');
                        const original = new Blob([bytes], { type: imageTypes[extensionOf(path)] });
                        let preview = original;
                        let transparent = null;
                        try {
                            const bitmap = await createImageBitmap(original);
                            try {
                                const scale = Math.min(1, 520 / bitmap.width, 520 / bitmap.height);
                                const canvas = document.createElement('canvas');
                                canvas.width = Math.max(1, Math.round(bitmap.width * scale));
                                canvas.height = Math.max(1, Math.round(bitmap.height * scale));
                                const context = canvas.getContext('2d');
                                context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
                                transparent = hasTransparency(context, canvas.width, canvas.height);
                                preview = await new Promise(resolve => canvas.toBlob(blob => resolve(blob || original), 'image/png'));
                            } finally {
                                bitmap.close();
                            }
                        } catch (_) {
                            preview = original;
                        }
                        // Without a sample, formats that usually carry a cut-out get the checkerboard.
                        if (transparent === null) transparent = ['png', 'gif'].includes(extensionOf(path));
                        const url = createFileUrl(preview);
                        image.addEventListener('load', () => { thumb.dataset.state = 'ready'; }, { once: true });
                        image.addEventListener('error', () => {
                            releaseFileUrl(url);
                            thumb.style.removeProperty('--media-file-backdrop');
                            delete thumb.dataset.fill;
                            image.remove();
                            thumb.dataset.state = 'failed';
                        }, { once: true });
                        if (transparent) {
                            thumb.dataset.fill = 'transparent';
                        } else {
                            thumb.dataset.fill = 'photo';
                            thumb.style.setProperty('--media-file-backdrop', `url("${url}")`);
                        }
                        image.src = url;
                    } catch (_) {
                        image.remove();
                        thumb.dataset.state = 'failed';
                    }
                }

                function createTile(path) {
                    const isPicture = Object.hasOwn(imageTypes, extensionOf(path));
                    const filename = path.split('/').pop();
                    const li = document.createElement('li');
                    // Documents are tiles too: their file type fills the well a picture would.
                    li.className = isPicture ? 'media-file-row media-file-tile' : 'media-file-row media-file-tile media-file-doc';

                    const thumb = document.createElement('span');
                    if (isPicture) {
                        thumb.className = 'media-file-thumb';
                        thumb.dataset.state = 'loading';
                        const image = document.createElement('img');
                        image.alt = '';
                        image.decoding = 'async';
                        image.dataset.path = path;
                        thumb.appendChild(image);
                        if (thumbnails) thumbnails.observe(image); else showThumbnail(image);
                    } else {
                        thumb.className = 'media-file-thumb media-file-doc-thumb';
                        const icon = document.createElement('i');
                        icon.className = extensionOf(path) === 'pdf' ? 'fas fa-file-pdf media-file-icon' : 'fas fa-file-lines media-file-icon';
                        icon.setAttribute('aria-hidden', 'true');
                        thumb.appendChild(icon);
                    }
                    li.appendChild(thumb);

                    const name = document.createElement('span');
                    name.className = 'media-file-name';
                    appendFileName(name, filename);

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = 'Download';
                    btn.setAttribute('aria-label', `Download ${filename}`);
                    btn.className = 'media-file-button';
                    btn.addEventListener('click', async () => {
                        const status = document.getElementById('downloadStatus');
                        try {
                            const extracted = await zip.file(path).async('blob');
                            const blob = extracted.slice(0, extracted.size, typeOf(path));
                            const url = createFileUrl(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            // Allow the browser to consume the download before revoking.
                            setTimeout(() => releaseFileUrl(url), 60000);
                            btn.removeAttribute('data-download-failed');
                            btn.removeAttribute('aria-description');
                            btn.removeAttribute('title');
                            status.textContent = '';
                        } catch (_) {
                            const message = `${filename}: Download failed. Try again or use the ZIP link above.`;
                            btn.setAttribute('data-download-failed', '');
                            btn.setAttribute('aria-description', message);
                            btn.title = message;
                            status.textContent = message;
                        }
                    });

                    li.appendChild(name);
                    li.appendChild(btn);
                    return { li, isPicture };
                }

                function createList(className, items) {
                    const list = document.createElement('ul');
                    list.className = `media-kit-file-list media-kit-tiles ${className}`.trim();
                    for (const item of items) list.appendChild(item.li);
                    if (balancedLists) balancedLists.observe(list);
                    return list;
                }

                for (const folder of folders) {
                    const tiles = groups.get(folder).map(createTile);
                    // Documents lead, pictures follow, each in file-name order.
                    const docs = tiles.filter(tile => !tile.isPicture);
                    const pictures = tiles.filter(tile => tile.isPicture);
                    const group = document.createElement('section');
                    group.className = 'media-kit-group';

                    if (!folder) {
                        // The kit's own top-level files: its hero pictures are featured
                        // large, with its documents as a compact strip below.
                        group.classList.add('media-kit-root');
                        if (pictures.length) group.appendChild(createList('media-kit-featured', pictures));
                        if (docs.length) group.appendChild(createList('media-kit-docs', docs));
                    } else {
                        const head = document.createElement('div');
                        head.className = 'media-kit-group-head';
                        const title = document.createElement('h2');
                        title.className = 'media-kit-group-title';
                        title.textContent = folder;
                        const count = document.createElement('span');
                        count.className = 'media-kit-group-count';
                        count.textContent = String(tiles.length);
                        head.append(title, count);
                        group.appendChild(head);
                        group.appendChild(createList('', [...docs, ...pictures]));
                    }
                    listEl.appendChild(group);
                }
            } catch (e) {
                console.error(e);
                fallbackEl.style.display = 'flex';
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', loadList);
    </script>
</body>
</html>
