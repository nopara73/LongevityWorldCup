<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unsubscribe - Longevity World Cup</title>
    <!--HEAD-->
    <style>
        .join-game {
            display: none !important;
        }

        .unsubscribe-panel {
            max-width: 620px;
            margin: 2.25rem auto;
            padding: 2rem;
            background: var(--lwc-surface, #ffffff);
            border: 1px solid var(--lwc-border, #d7e0e6);
            border-radius: var(--lwc-radius-md, 8px);
            box-shadow: var(--lwc-shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.08));
            text-align: center;
        }

        .unsubscribe-panel h1 {
            margin-top: 0;
            margin-bottom: 0.8rem;
            font-size: 2.5rem;
            line-height: 1.12;
            overflow-wrap: normal;
        }

        .unsubscribe-copy {
            max-width: 34rem;
            margin: 0 auto;
            color: var(--lwc-muted, #52606d);
            line-height: 1.45;
        }

        .unsubscribe-form {
            display: grid;
            gap: 0.75rem;
            max-width: 420px;
            margin: 1.5rem auto 0;
            text-align: left;
        }

        .unsubscribe-form label {
            font-weight: 700;
            color: var(--lwc-ink, #17212b);
        }

        .unsubscribe-form input {
            width: 100%;
            box-sizing: border-box;
            min-height: 46px;
            padding: 0.75rem 0.85rem;
            border: 1px solid var(--lwc-border-strong, #71808d);
            border-radius: var(--lwc-radius-sm, 4px);
            background: var(--lwc-surface, #ffffff);
            color: var(--lwc-ink, #17212b);
            font: inherit;
        }

        .unsubscribe-form input:focus {
            border-color: var(--primary-color);
            outline: 3px solid rgba(0, 188, 212, 0.18);
            outline-offset: 1px;
        }

        #unsubscribe-form input[aria-invalid="true"] {
            border-color: var(--lwc-danger, #b4233b);
            outline-color: var(--lwc-danger, #b4233b);
        }

        .unsubscribe-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            justify-self: stretch;
            min-height: 46px;
            margin-top: 0.25rem;
            padding: 0.75rem 1.15rem;
            border: none;
            border-radius: var(--lwc-radius-sm, 4px);
            background: var(--lwc-accent, #087685);
            color: var(--lwc-on-accent, #ffffff);
            font-weight: 700;
            cursor: pointer;
            box-shadow: none;
            transition: background-color var(--lwc-duration-fast, 140ms) var(--lwc-ease, ease);
        }

        .unsubscribe-button:hover,
        .unsubscribe-button:focus-visible {
            background: var(--lwc-accent-hover, #065d68);
            box-shadow: none;
            transform: none;
        }

        .unsubscribe-button:focus-visible {
            outline: 3px solid var(--lwc-accent, #087685);
            outline-offset: 2px;
        }

        .unsubscribe-button[aria-disabled="true"] {
            cursor: progress;
            opacity: 0.7;
        }

        .unsubscribe-message {
            grid-column: 1 / -1;
            min-width: 0;
            margin: 0;
            padding: 0.75rem 0.85rem;
            border-left: 3px solid var(--lwc-success, #1f7a38);
            border-radius: var(--lwc-radius-sm, 4px);
            background: var(--lwc-surface-muted, #eef2f5);
            color: var(--lwc-ink, #17212b);
            text-align: left;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .unsubscribe-message:empty {
            display: none;
        }

        .unsubscribe-message.is-error {
            border-left-color: var(--lwc-danger, #b4233b);
        }

        @media (max-width: 600px) {
            .unsubscribe-panel {
                margin: 1.5rem 1rem;
                padding: 1.35rem 1rem;
                border-radius: var(--lwc-radius-md, 8px);
            }

            .unsubscribe-panel h1 {
                font-size: clamp(1.8rem, 9vw, 2rem);
            }

            .unsubscribe-button {
                min-height: 46px;
            }
        }

        @media (min-width: 560px) and (max-width: 932px) and (max-height: 480px) {
            .unsubscribe-panel {
                max-width: 620px;
                margin: 0.8rem auto 1.5rem;
                padding: 1rem 1.25rem;
            }

            .unsubscribe-panel h1 {
                margin-bottom: 0.45rem;
                font-size: clamp(2rem, 6vw, 2.55rem);
            }

            .unsubscribe-copy {
                line-height: 1.3;
            }

            .unsubscribe-form {
                max-width: none;
                margin-top: 1rem;
                grid-template-columns: minmax(0, 1fr) minmax(9rem, 12rem);
                align-items: end;
            }

            .unsubscribe-form label {
                grid-column: 1 / -1;
            }

            .unsubscribe-form input,
            .unsubscribe-button {
                min-height: 44px;
            }

            .unsubscribe-button {
                margin-top: 0;
            }
        }

        @media (max-width: 300px) {
            .unsubscribe-panel {
                margin: 1.25rem 0.45rem;
                padding: 1.2rem 0.75rem;
            }

            .unsubscribe-panel h1 {
                font-size: 1.65rem;
            }
        }
    </style>
</head>
<body>
    <!--HEADER-->
    <main>
        <section class="unsubscribe-panel">
            <h1>Unsubscribe</h1>
            <p class="unsubscribe-copy">Remove your email from the Longevity World Cup yearly newsletter.</p>

            <form id="unsubscribe-form" class="unsubscribe-form" novalidate>
                <label for="email">Email address</label>
                <input id="email"
                       name="email"
                       type="email"
                       autocomplete="email"
                       autocapitalize="none"
                       spellcheck="false"
                       aria-describedby="message"
                       placeholder="you@example.com"
                       required />

                <button id="unsubscribe-button"
                        type="submit"
                        class="unsubscribe-button"
                        aria-describedby="message">
                    Unsubscribe
                </button>
                <p id="message" class="unsubscribe-message" role="status" aria-live="polite" aria-atomic="true"></p>
            </form>
        </section>
    </main>

    <!--FOOTER-->
    <script>
        history.replaceState({ modal: "details" }, "", "/unsubscribe");

        (function () {
            const form = document.getElementById("unsubscribe-form");
            const emailInput = document.getElementById("email");
            const button = document.getElementById("unsubscribe-button");
            const message = document.getElementById("message");
            let submitting = false;
            let retryEmail = "";

            function setMessage(text, isError) {
                message.textContent = text;
                message.classList.toggle("is-error", Boolean(text) && isError);
            }

            function renderAction() {
                button.setAttribute("aria-disabled", String(submitting));
                button.setAttribute("aria-busy", String(submitting));
                form.setAttribute("aria-busy", String(submitting));
                button.textContent = submitting ? "Unsubscribing…"
                    : retryEmail && retryEmail === emailInput.value.trim() ? "Retry" : "Unsubscribe";
            }

            function showFailure(email, explanation) {
                retryEmail = email;
                setMessage(emailInput.value.trim() === email ? explanation : `${email}: ${explanation}`, true);
            }

            emailInput.addEventListener("input", () => {
                retryEmail = "";
                emailInput.removeAttribute("aria-invalid");
                setMessage("", false);
                renderAction();
            });

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                if (submitting) return;

                const email = (emailInput.value || "").trim();
                emailInput.value = email;
                if (!emailInput.checkValidity()) {
                    setMessage(email ? "Enter a valid email address." : "Enter your email address.", true);
                    emailInput.setAttribute("aria-invalid", "true");
                    emailInput.focus();
                    return;
                }

                emailInput.removeAttribute("aria-invalid");
                retryEmail = "";
                setMessage("", false);
                submitting = true;
                renderAction();
                const controller = new AbortController();
                // Keep the timeout active through error-body reads as well.
                const timeout = setTimeout(() => controller.abort(), 10000);

                try {
                    const response = await fetch("/api/home/unsubscribe", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: email }),
                        signal: controller.signal
                    });

                    if (!response.ok) {
                        const serverMessage = (await response.text()).trim();
                        const explanation = response.status === 400 && response.headers.get("content-type")?.includes("text/plain") && serverMessage
                            ? serverMessage : "Couldn’t confirm the removal. Try again.";
                        showFailure(email, explanation);
                        return;
                    }

                    // Confirm only the submitted address, preserving a later edit.
                    if (emailInput.value.trim() === email) emailInput.value = "";
                    setMessage(`Removed ${email} from the yearly newsletter.`, false);
                } catch (_) {
                    showFailure(email, "Couldn’t confirm the removal. Try again.");
                } finally {
                    clearTimeout(timeout);
                    submitting = false;
                    renderAction();
                }
            });
        })();
    </script>
</body>
</html>
